<!DOCTYPE html><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>トビヨリ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* ===================== Tokens ===================== */
:root{
  --bg:#F5F9F2;
  --surface:#FFFFFF;
  --surface-alt:#EAF3E6;
  --surface-raised:#FFFFFF;
  --ink:#1B2A20;
  --ink-soft:#516156;
  --ink-faint:#7E8F82;
  --line:#DCE6D6;
  --line-strong:#C3D3BC;
  --green:#1F7A52;
  --green-deep:#155C3E;
  --green-pale:#DFF0E2;
  --blue:#2A6BA0;
  --blue-deep:#1F5480;
  --blue-pale:#E1EDF7;
  --amber:#9C6A0B;
  --amber-pale:#F8EFD8;
  --red:#B23B2C;
  --red-pale:#FBE5E0;
  --shadow:0 1px 2px rgba(20,40,25,.07), 0 10px 26px -10px rgba(20,40,25,.22);
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Meiryo',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101812;
    --surface:#17211A;
    --surface-alt:#1D2A20;
    --surface-raised:#1C2820;
    --ink:#E9F2E6;
    --ink-soft:#AEC2AC;
    --ink-faint:#7C9080;
    --line:#2B3A2E;
    --line-strong:#3B4E3E;
    --green:#4FBF8C;
    --green-deep:#7EDBAD;
    --green-pale:#1E3A2B;
    --blue:#72B2E8;
    --blue-deep:#9ECDF3;
    --blue-pale:#1B3348;
    --amber:#E2B054;
    --amber-pale:#3A2E14;
    --red:#E68579;
    --red-pale:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101812;
  --surface:#17211A;
  --surface-alt:#1D2A20;
  --surface-raised:#1C2820;
  --ink:#E9F2E6;
  --ink-soft:#AEC2AC;
  --ink-faint:#7C9080;
  --line:#2B3A2E;
  --line-strong:#3B4E3E;
  --green:#4FBF8C;
  --green-deep:#7EDBAD;
  --green-pale:#1E3A2B;
  --blue:#72B2E8;
  --blue-deep:#9ECDF3;
  --blue-pale:#1B3348;
  --amber:#E2B054;
  --amber-pale:#3A2E14;
  --red:#E68579;
  --red-pale:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ===================== Base ===================== */
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  padding-bottom:78px;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  color:var(--ink);
  line-height:1.4;
  text-wrap:balance;
  margin:0;
}
p{margin:0;}
a{color:var(--green-deep);}
button{font-family:inherit;}
img{display:block;}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px; border-radius:6px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

.container{max-width:1080px;margin:0 auto;padding:0 20px;}
.eyebrow{
  font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--green-deep);
  text-transform:uppercase;
}
.section{padding:44px 0;}
.section-head{margin-bottom:22px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;}
.section-head h2{font-size:24px;font-weight:900;}
.section-head p{color:var(--ink-soft);font-size:15px;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);font-size:13px;}

/* ===================== Header / Nav ===================== */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1080px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:none;padding:0;}
.brand-mark{
  width:38px;height:38px;border-radius:12px;background:linear-gradient(155deg,var(--green) 0%, var(--blue) 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark svg{width:22px;height:22px;}
.brand-name{font-family:var(--font-display);font-weight:900;font-size:17px;letter-spacing:.01em;}
.brand-sub{font-size:11px;color:var(--ink-soft);letter-spacing:.03em;}
.desktop-nav{display:none;gap:4px;align-items:center;}
.desktop-nav button{
  background:none;border:none;padding:9px 14px;border-radius:999px;font-size:14.5px;font-weight:700;
  color:var(--ink-soft);cursor:pointer;
}
.desktop-nav button.active{background:var(--green-pale);color:var(--green-deep);}
.desktop-nav button:hover{color:var(--ink);}
.topbar-cta{display:none;gap:8px;}
@media (min-width:860px){
  .desktop-nav{display:flex;}
  .topbar-cta{display:flex;}
  body{padding-bottom:0;}
}

.bottom-tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-between;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 20px -12px rgba(0,0,0,.25);
}
@media (min-width:860px){.bottom-tabs{display:none;}}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-faint);padding:6px 2px 4px;font-size:11px;font-weight:700;
  cursor:pointer;border-radius:10px;
}
.tab-btn svg{width:22px;height:22px;}
.tab-btn.active{color:var(--green-deep);}

/* ===================== Buttons ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-weight:700;font-size:15px;border-radius:999px;padding:12px 20px;
  border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;
  transition:transform .06s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-deep);}
.btn-secondary{background:var(--blue-pale);color:var(--blue-deep);}
.btn-secondary:hover{background:var(--blue);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-danger{background:var(--red-pale);color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-sm{padding:8px 14px;font-size:13.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

/* ===================== Cards & badges ===================== */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  box-shadow:var(--shadow);
}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:999px;white-space:nowrap;
}
.badge-verified{background:var(--blue-pale);color:var(--blue-deep);}
.badge-beginner{background:var(--green-pale);color:var(--green-deep);}
.badge-genre{border:1px solid color-mix(in srgb, var(--gc) 45%, var(--surface));background:color-mix(in srgb, var(--gc) 16%, var(--surface));color:var(--gc);}
.badge-neutral{background:var(--surface-alt);color:var(--ink-soft);}
.badge-warn{background:var(--amber-pale);color:var(--amber);}
.badge-danger{background:var(--red-pale);color:var(--red);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gc);flex-shrink:0;}

.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
  padding:8px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-soft);cursor:pointer;user-select:none;
}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;}
.chip input{display:none;}

/* activity card */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
.act-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;
  text-align:left;padding:0;border:1px solid var(--line);
}
.act-card:hover{border-color:var(--green);}
.act-card.urgent{border-color:color-mix(in srgb, var(--red) 45%, var(--surface));box-shadow:0 0 0 1px color-mix(in srgb, var(--red) 25%, transparent), var(--shadow);}
.act-media{
  height:112px;background:linear-gradient(135deg, color-mix(in srgb, var(--gc) 30%, var(--surface-alt)), color-mix(in srgb, var(--gc) 10%, var(--surface-alt)));
  display:flex;align-items:flex-end;padding:10px 12px;gap:6px;flex-wrap:wrap;
}
.act-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.act-title{font-family:var(--font-display);font-weight:900;font-size:16.5px;line-height:1.4;}
.act-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-soft);}
.act-meta-row{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;color:var(--ink-soft);}
.act-meta-row span{display:inline-flex;align-items:center;gap:5px;}
.act-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px;}
.icon{width:15px;height:15px;flex-shrink:0;color:var(--ink-faint);}

/* ===================== Form fields ===================== */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-weight:700;font-size:14px;}
.field .hint{font-size:12.5px;color:var(--ink-faint);}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  font-family:inherit;font-size:15px;padding:11px 13px;border-radius:var(--radius-s);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%;
}
.field textarea{min-height:88px;resize:vertical;}
.checkline{display:flex;align-items:flex-start;gap:10px;font-size:14px;}
.checkline input{margin-top:3px;width:18px;height:18px;flex-shrink:0;}
fieldset{border:none;padding:0;margin:0;}

/* ===================== Misc panels ===================== */
.info-box{
  display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-m);background:var(--blue-pale);
  border:1px solid color-mix(in srgb, var(--blue) 25%, var(--surface));
}
.info-box.warn{background:var(--amber-pale);border-color:color-mix(in srgb, var(--amber) 30%, var(--surface));}
.info-box svg{width:20px;height:20px;color:var(--blue-deep);flex-shrink:0;margin-top:2px;}
.info-box.warn svg{color:var(--amber);}
.info-box-title{font-weight:800;font-size:14.5px;margin-bottom:3px;}

.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px 18px;box-shadow:var(--shadow);}
.stat-num{font-family:var(--font-display);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;}

table{width:100%;border-collapse:collapse;font-size:14px;}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--surface-alt);font-weight:800;font-size:13px;color:var(--ink-soft);}
tr:last-child td{border-bottom:none;}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;}
.tab{padding:11px 16px;font-weight:700;font-size:14.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab.active{color:var(--green-deep);border-bottom-color:var(--green);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,25,18,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal{
  background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:22px 22px 26px;box-shadow:var(--shadow);
}
@media(min-width:640px){.modal{border-radius:var(--radius-l);}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
.modal-close{background:var(--surface-alt);border:none;border-radius:50%;width:32px;height:32px;flex-shrink:0;cursor:pointer;color:var(--ink-soft);font-size:16px;}

/* Toast */
.toast-wrap{position:fixed;bottom:88px;left:0;right:0;display:flex;justify-content:center;z-index:200;pointer-events:none;}
@media(min-width:860px){.toast-wrap{bottom:26px;}}
.toast{background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:var(--shadow);max-width:90vw;}
.toast-reward{background:linear-gradient(120deg, var(--amber), #C98A1F);color:#2A1C02;}

/* Points & levels */
.level-orb{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px color-mix(in srgb, white 30%, transparent);}
.progress-track{height:10px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--line);overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg, var(--green), var(--blue));transition:width .5s ease;}
.badge-locked{opacity:.4;filter:grayscale(1);}
.pt-hint{font-size:11.5px;font-weight:800;opacity:.85;margin-left:2px;}
.achv-row{display:flex;flex-direction:column;gap:10px;}
.achv-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius-s);border:1px solid var(--line);}
.achv-item.unlocked{background:var(--amber-pale);border-color:color-mix(in srgb, var(--amber) 35%, var(--surface));}
.achv-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-alt);color:var(--ink-faint);}
.achv-item.unlocked .achv-icon{background:var(--amber);color:#2A1C02;}

/* Hero */
.hero{background:linear-gradient(180deg, var(--green-pale), var(--bg) 75%);padding:36px 0 30px;}
.hero-inner{display:flex;flex-direction:column;gap:18px;}
.hero h1{font-size:30px;font-weight:900;}
.hero-lead{font-size:15.5px;color:var(--ink-soft);max-width:36em;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.hero-art{align-self:center;width:100%;max-width:360px;}
@media(min-width:760px){
  .hero-inner{flex-direction:row;align-items:center;justify-content:space-between;}
  .hero-text{max-width:520px;}
  .hero h1{font-size:36px;}
}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow);}
.step-num{font-family:var(--font-display);font-weight:900;font-size:13px;color:var(--green-deep);background:var(--green-pale);border-radius:999px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}

.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximate;}
.rail .act-card{min-width:260px;scroll-snap-align:start;}

/* Filters */
.filter-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:20px;box-shadow:var(--shadow);}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.filter-row:last-child{margin-bottom:0;}
.filter-group-label{font-size:12px;font-weight:800;color:var(--ink-faint);letter-spacing:.04em;width:100%;margin-bottom:2px;}
.filter-select{font-family:inherit;font-size:13.5px;padding:8px 10px;border-radius:var(--radius-s);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}

/* Map */
.map-wrap{position:relative;border-radius:var(--radius-l);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);}
.map-svg{width:100%;height:auto;display:block;}
.pin{cursor:pointer;}
.pin circle.hit{fill:transparent;}
.pin circle.halo{fill:color-mix(in srgb, var(--gc) 25%, transparent);}
.pin circle.core{fill:var(--gc);stroke:var(--surface);stroke-width:2.5;}
.pin:hover circle.core{stroke-width:3.5;}
.pin:hover circle.halo{fill:color-mix(in srgb, var(--gc) 40%, transparent);}
.map-region{cursor:pointer;transition:opacity .15s ease;}
.map-region:hover{opacity:.7;}
.map-region.active{stroke:var(--green-deep);stroke-width:3;}
.map-legend{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:12.5px;background:var(--surface-alt);}
.map-legend span{display:inline-flex;align-items:center;gap:5px;}
.map-popup{
  position:absolute;bottom:14px;left:14px;right:14px;background:var(--surface);border-radius:var(--radius-m);
  box-shadow:var(--shadow);padding:14px 16px;border:1px solid var(--line);
}

/* Detail layout */
.detail-layout{display:grid;grid-template-columns:1fr;gap:24px;}
@media(min-width:900px){.detail-layout{grid-template-columns:1.6fr 1fr;align-items:start;}}
.sticky-panel{position:sticky;top:84px;}
.detail-block{margin-bottom:26px;}
.detail-block h3{font-size:17px;font-weight:900;margin-bottom:10px;}
.kv-list{display:flex;flex-direction:column;gap:10px;}
.kv-row{display:flex;gap:10px;font-size:14.5px;}
.kv-row .k{width:112px;flex-shrink:0;color:var(--ink-soft);font-weight:700;font-size:13.5px;}
.kv-row .v{flex:1;}
.location-mask{background:var(--surface-alt);border:1px dashed var(--line-strong);border-radius:var(--radius-s);padding:12px 14px;font-size:13.5px;color:var(--ink-soft);}

/* profile */
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(155deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-family:var(--font-display);font-size:20px;flex-shrink:0;}
.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:18px;}

hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0;}

.link-row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;}
.footer{background:var(--surface-alt);border-top:1px solid var(--line);padding:30px 0 100px;margin-top:20px;}
@media(min-width:860px){.footer{padding-bottom:40px;}}
.footer h4{font-size:13px;color:var(--ink-faint);letter-spacing:.05em;margin-bottom:10px;}
.footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:22px;margin-bottom:20px;}
.footer nav{display:flex;flex-direction:column;gap:8px;}
.footer button, .footer a{background:none;border:none;padding:0;text-align:left;font-size:14px;color:var(--ink-soft);cursor:pointer;text-decoration:none;}
.footer button:hover, .footer a:hover{color:var(--green-deep);}
.footer-note{font-size:12.5px;color:var(--ink-faint);border-top:1px solid var(--line);padding-top:16px;line-height:1.8;}

.sr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.sr-list li{position:relative;padding-left:20px;font-size:14.5px;}
.sr-list li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;background:var(--green);}

.pill-status{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;}
.status-pending{background:var(--amber-pale);color:var(--amber);}
.status-approved{background:var(--green-pale);color:var(--green-deep);}
.status-done{background:var(--surface-alt);color:var(--ink-soft);}
.status-rejected{background:var(--red-pale);color:var(--red);}
.status-review{background:var(--blue-pale);color:var(--blue-deep);}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
.activity-group{margin:28px 0 38px;padding:22px 16px;background:var(--surface-alt);border-radius:18px;}
.activity-facts{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px 10px;font-size:14px;line-height:1.7;margin:12px 0 16px;text-align:left;}
.activity-facts dt{font-weight:700;color:var(--ink-soft);}
.activity-facts dd{margin:0;overflow-wrap:anywhere;}
@media(max-width:480px){.activity-group{padding:16px 10px;}.activity-facts{font-size:14px;}}
/* 元画像を加工せず、上部の横長ロゴを表示する */

async function accountAPI(url, method='GET', data) {
  const headers=data?{'Content-Type':'application/json'}:{};
  if(accountUser && (['state','logout','google/start'].includes(url)||url.startsWith('live/')))headers['X-Tobiyori-Account']=accountUser.id;
  const response = await fetch('/api/'+url, {method, credentials:'same-origin',cache:'no-store',headers,body:data?JSON.stringify(data):undefined});
  const result = await response.json();
  if(!response.ok) throw Object.assign(new Error(result.error || '接続できませんでした。'),{status:response.status});
  return result;
}

function queueAccountSave() {
  if(!ACCOUNT_SERVER || !accountUser || !accountReady) { toast('保存にはログインが必要です。');return false; }
  try { pendingAccountState=JSON.parse(JSON.stringify(DB)); }
  catch {return false;}
  accountNotice();
  flushAccount().catch(()=>{});
  return true;
}
async function flushAccount() {
  if(accountSaving)return accountSaving;
  if(!pendingAccountState)return;
  const epoch=accountEpoch;
  accountSaving=(async()=>{
    while(pendingAccountState && epoch===accountEpoch) {
      const snapshot=pendingAccountState; pendingAccountState=null;
      try {
        const result=await accountAPI('state','PUT',{state:snapshot,revision:accountRevision});
        if(epoch!==accountEpoch)return;
        accountRevision=result.revision;accountError='';accountConflict=false;
      } catch(e) {
        if(epoch===accountEpoch){pendingAccountState=pendingAccountState||snapshot;accountConflict=e.status===409;accountError=e.status===409?e.message:e.status===401?'ログインの有効期限が切れました。未保存の変更があります。':'未保存の変更があります。接続を確認して保存を再試行してください。';}
        throw e;
      }
    }
  })();
  try {await accountSaving;} finally {accountSaving=null;accountNotice();}
}
async function loadAccountState() {
  const result=await accountAPI('state');
  const base=defaultStore();
  DB=Object.assign(base,result.state||{});
  DB.profile=Object.assign(defaultStore().profile,result.state?.profile||{nickname:accountUser.nickname});
  accountRevision=result.revision;
  pendingAccountState=null;accountError='';
}

  if(!ACCOUNT_SERVER){accountReady=true;render();return;}
  try {googleEnabled=(await accountAPI('auth-options')).googleEnabled===true;googleOptionsFailed=false;}catch{googleEnabled=false;googleOptionsFailed=true;}
  try { const result=await accountAPI('me');accountUser=result.user;await loadAccountState(); }
  catch(e){accountUser=null;DB=defaultStore();if(e.status!==401)accountError='アカウントに接続できませんでした。ページを再読み込みしてください。';}
  accountReady=true;await refreshLive(false);render();
}

    closeModal();mypageTab='profile';nav('home');accountNotice();toast('ログアウトしました');

function waitingRoomHTML(r){
 const a=LIVE.catalog.activities.find(a=>a.id===r.activityId),sent=new Set(r.greetings.filter(m=>m.isMe).map(m=>m.phrase));
 const controls=`<div class="waiting-controls"><button class="btn btn-ghost btn-sm" data-waiting-refresh>最新の様子を見る</button>${r.joined?'<button class="btn btn-ghost btn-sm" data-waiting-leave>ラウンジから退出</button>':''}<button class="btn btn-ghost btn-sm" data-live-report="${escapeHtml(r.communityId)}" data-report-activity="${escapeHtml(r.activityId)}">運営に相談・通報</button></div>`;

 if(r.state==='NOT_JOINED')body=r.canJoin?`<div class="waiting-panel"><h3>この活動が、ちょっと気になる。</h3><p>同じ気持ちの人がそろったら、自動でグループになります。</p><form id="waitingJoinForm"><label>ラウンジで使う呼び名<input name="name" maxlength="20" required value="${escapeHtml((DB.profile.nickname||'').slice(0,20))}" placeholder="ニックネーム"></label><p class="hint">本名・連絡先は書かないでください。</p><label>年齢区分<select name="ageBand" required><option value="">選んでください</option><option value="adult">18歳以上</option><option value="minor">18歳未満</option></select></label><label class="account-consent"><input name="consent" type="checkbox" required><span>同じ活動のグループに自動で入り、呼び名をグループ・担当者・運営に表示することに同意します。</span></label><p class="hint">ラウンジに入っても、活動への申込みにはなりません。</p><p class="live-form-error" role="alert"></p><button class="btn btn-primary" type="submit">気になる仲間を待つ</button></form></div>`:'<div class="waiting-panel"><p>このラウンジへの新しい入室はできません。担当者・運営者は運営画面から様子を確認できます。</p></div>';
 if(r.state==='WAITING')body=`<div class="waiting-panel waiting-pending"><span class="waiting-kicker">ラウンジへようこそ</span><h3>ここで、ちょっとひと休み。</h3><p>同じ「気になる」の仲間を待っています。</p><p>今の区分で仲間待ち <strong>${r.waiting}人</strong></p><div class="waiting-seat-row" aria-hidden="true">${[0,1,2].map(i=>`<span class="waiting-seat ${i<r.waiting?'occupied':''}">${i<r.waiting?'●':'＋'}</span>`).join('')}</div><p>3人そろうと自動でグループになり、アプリ内でお知らせします。<br>この画面を離れていても大丈夫です。</p><p class="hint">集まるまでの時間は決まっていません。参加するかは、あとで決められます。</p></div>`;
 if(r.state==='ON_HOLD')body='<div class="waiting-panel"><h3>活動の変更内容を確認しています</h3><p>確認が終わるまで、仲間づくりとあいさつを一時停止しています。</p></div>';
 if(r.state==='MATCHED')body=`<div class="waiting-panel waiting-party"><div class="waiting-party-sparks" aria-hidden="true">✦　✧　✦</div><span class="waiting-kicker">同じ活動が気になる ${r.peers.length}人</span><h3>「気になる仲間」が、見つかりました。</h3><p>まずは、ひとこと。参加はまだ決めなくて大丈夫です。</p><ul class="waiting-people">${r.peers.map((p,i)=>`<li><span class="waiting-person tone-${i}" aria-hidden="true">${escapeHtml(p.name.slice(0,1))}</span><b>${escapeHtml(p.name)}</b><small>${p.isMe?'あなた':'検討中の仲間'}</small></li>`).join('')}</ul><h4>気軽にあいさつ</h4><div class="waiting-phrases">${Object.entries(r.phrases).map(([key,label])=>`<button class="btn btn-secondary btn-sm" data-waiting-greet="${key}" ${sent.has(key)?'disabled':''}>${escapeHtml(label)}${sent.has(key)?' ✓':''}</button>`).join('')}</div><div class="waiting-greetings" aria-live="polite">${r.greetings.map(m=>`<article class="waiting-greeting ${m.isMe?'mine':''}"><b>${escapeHtml(m.name)}${m.isMe?'（あなた）':''}</b><p>${escapeHtml(m.text)}</p></article>`).join('')||'<p class="hint">まだあいさつはありません。用意されたひとことから送れます。</p>'}</div></div>`;
 return `<div data-waiting-state="${r.state}">${body}${r.joined?`<div class="waiting-next"><div><h3>行ってみたいと思ったら</h3><p>活動の内容や条件を確かめて、自分のタイミングで申し込めます。</p></div><a class="btn btn-primary" href="#/liveactivity/${encodeURIComponent(r.activityId)}">${r.applicationStatus&&r.applicationStatus!=='CANCELLED'?'活動・申込み状況を見る':'活動を確かめて、参加を考える'}</a></div>`:''}${controls}${a?'':'<p class="hint">活動の公開状況を確認してください。</p>'}</div>`;
}
async function loadWaitingRoom(feed){
 const aid=feed.dataset.waitingRoom,version=++waitingRoomRequest,uid=accountUser?.id,epoch=accountEpoch;
 try{const r=await accountAPI('live/waiting-room/'+encodeURIComponent(aid));if(version!==waitingRoomRequest||uid!==accountUser?.id||epoch!==accountEpoch||!feed.isConnected)return;feed.innerHTML=waitingRoomHTML(r);bindWaitingRoomActions(feed,aid);bindSupportUI(feed);}
 catch(e){if(version!==waitingRoomRequest||uid!==accountUser?.id||epoch!==accountEpoch||!feed.isConnected)return;feed.innerHTML=`<p class="live-form-error" role="alert">${escapeHtml(e.message)}</p><button class="btn btn-secondary" data-waiting-refresh>もう一度確認</button><a class="btn btn-ghost" href="#/waiting">ラウンジの一覧へ</a>`;bindWaitingRoomActions(feed,aid);}
}
function bindWaitingRoomActions(feed,aid){
 feed.querySelector('[data-waiting-refresh]')?.addEventListener('click',()=>loadWaitingRoom(feed));
 const f=feed.querySelector('#waitingJoinForm');if(f)f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button'),uid=accountUser?.id,epoch=accountEpoch;b.disabled=true;f.querySelector('[role="alert"]').textContent='';try{await accountAPI('live/waiting-room/'+encodeURIComponent(aid)+'/join','POST',{name:f.elements.name.value,minor:f.elements.ageBand.value==='minor',consent:f.elements.consent.checked});if(uid!==accountUser?.id||epoch!==accountEpoch)return;await loadWaitingRoom(feed);await refreshLive(false);}catch(error){if(uid===accountUser?.id&&epoch===accountEpoch){f.querySelector('[role="alert"]').textContent=error.message;b.disabled=false;}}};
 feed.querySelectorAll('[data-waiting-greet]').forEach(b=>b.onclick=async()=>{const uid=accountUser?.id,epoch=accountEpoch;b.disabled=true;try{await accountAPI('live/waiting-room/'+encodeURIComponent(aid)+'/greet','POST',{phrase:b.dataset.waitingGreet});if(uid===accountUser?.id&&epoch===accountEpoch)await loadWaitingRoom(feed);}catch(e){if(uid===accountUser?.id&&epoch===accountEpoch){toast(e.message);b.disabled=false;}}});
 feed.querySelector('[data-waiting-leave]')?.addEventListener('click',async e=>{const uid=accountUser?.id,epoch=accountEpoch;e.currentTarget.disabled=true;try{await accountAPI('live/waiting-room/'+encodeURIComponent(aid)+'/leave','POST',{});if(uid!==accountUser?.id||epoch!==accountEpoch)return;await loadWaitingRoom(feed);toast('ラウンジから退出しました。活動の申込み状況は変わりません。');}catch(error){toast(error.message);await loadWaitingRoom(feed);}});
}
function bindWaitingUI(scope){
 scope.querySelector('[data-waiting-browse]')?.addEventListener('click',()=>document.getElementById('waiting-activities')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
 const feed=scope.querySelector('[data-waiting-room]');if(feed&&accountUser)void loadWaitingRoom(feed);
 if(current.view==='waiting'&&!current.param&&accountUser){const uid=accountUser.id,epoch=accountEpoch;accountAPI('live/waiting-room').then(r=>{if(uid!==accountUser?.id||epoch!==accountEpoch)return;waitingJoined=r.joinedActivityIds;scope.querySelectorAll('[data-waiting-joined]').forEach(el=>el.hidden=!waitingJoined.includes(el.dataset.waitingJoined));}).catch(()=>{});}
 const operator=scope.querySelector('[data-waiting-operator]');if(operator){const uid=accountUser?.id,epoch=accountEpoch;accountAPI('live/waiting-room/operator').then(r=>{if(uid!==accountUser?.id||epoch!==accountEpoch||!operator.isConnected)return;operator.innerHTML=r.rooms.map(room=>`<section class="card live-card"><h2>${escapeHtml(room.title)}</h2><p>${escapeHtml(liveDate(room.startsAt))} ／ 仲間待ち ${room.waiting}人</p>${room.groups.map(g=>`<div class="waiting-panel"><h3>${escapeHtml(g.label)}</h3><p>${g.members.map(escapeHtml).join(' ・ ')}</p>${g.greetings.map(m=>`<p><b>${escapeHtml(m.name)}：</b>${escapeHtml(m.text)}</p>`).join('')||'<p class="hint">まだあいさつはありません。</p>'}</div>`).join('')}</section>`).join('')||'<p>現在、利用されているラウンジはありません。</p>';}).catch(e=>{if(uid===accountUser?.id&&epoch===accountEpoch&&operator.isConnected)operator.textContent=e.message;});}
}
setInterval(()=>{if(current.view!=='waiting'||!current.param||!accountUser||document.visibilityState!=='visible')return;const feed=document.querySelector('[data-waiting-room]');if(feed&&!feed.contains(document.activeElement)&&!document.querySelector('.modal-overlay')&&feed.querySelector('[data-waiting-state="WAITING"],[data-waiting-state="MATCHED"],[data-waiting-state="ON_HOLD"]'))void loadWaitingRoom(feed);},20000);

 ${communityDiscoveryFields(c)}${officialSourceSettings(c)}<section class="card live-card"><h2>写真・SNS <small>公開する内容</small></h2>${communityMediaFields(c).replace('この試作版では自分のアカウントのサンプル記録として保存されます。','登録した情報は確認後に団体紹介へ表示します。')}</section>

 <section class="card live-card"><h2>協賛の紹介 <small>公開する内容</small></h2><label class="account-consent"><input type="checkbox" name="sponsorListed" ${c.sponsorListed?'checked':''}><span>協賛団体として紹介する（協賛・名称掲載の同意を確認済み）</span></label>${liveField('sponsorMessage','協賛の紹介文（300文字以内）',c.sponsorMessage||'')}<p class="hint">募集がなくてもホームに紹介します。協賛を確認状況やおすすめの点数には使いません。</p></section>

function liveActivityForm(a){if(a.changePending)return '<div class="card live-card"><h2>変更案を確認中です</h2><p>審査結果をお待ちください。現在の参加者への案内は変更前の内容を保持しています。</p><button class="btn btn-secondary" data-nav="org">募集管理へ戻る</button></div>';const local=value=>value?new Date(new Date(value).getTime()-new Date(value).getTimezoneOffset()*60000).toISOString().slice(0,16):'';return `<form id="liveActivityForm" class="card live-card" data-id="${a.id}" data-published="${!!a.publishedAt}" data-updated="${escapeHtml(a.updatedAt||'')}"><h2>${a.publishedAt?'公開後の活動内容を変更':'募集内容を編集'}</h2>${a.publishedAt?'<p class="hint">変更案の送信後は新規受付を保留します。運営の確認後に参加者へ通知し、希望条件に合うか判定し直します。</p>':''}${liveField('title','活動名',a.title,'text',true)}${liveField('startsAt','開始日時',local(a.startsAt),'datetime-local',true)}${liveField('endsAt','終了日時',local(a.endsAt),'datetime-local',true)}${liveField('capacity','募集人数',String(a.capacity),'number',true)}${communityActivityGenreField(a)}${activityEntryFields(a)}${activityDiscoveryFields(a)}${conditionActivityFields(a)}<label><input name="beginner" type="checkbox" ${a.beginner?'checked':''}> 初参加歓迎</label> <label><input name="help" type="checkbox" ${a.help?'checked':''}> おたすけ募集</label>${Object.entries({purpose:'活動の目的',tasks:'具体的な内容',staff:'責任者',requirements:'参加条件',belongings:'持ち物',risk:'危険性と対策',insurance:'保険の加入状況',photoPolicy:'写真撮影の方針',transport:'交通手段',prohibited:'禁止事項',location:'正確な集合場所（承認後のみ表示）',emergency:'緊急連絡先（承認後のみ表示）'}).map(([k,label])=>liveField(k,label,a[k]||'','textarea')).join('')}<p class="live-form-error" role="alert"></p><button class="btn btn-primary" type="submit">${a.publishedAt?'変更案を送って審査を依頼':'下書きを保存'}</button><p class="hint">${a.publishedAt?'参加承認や取消は自動では行いません。':'保存後、「審査を依頼」を押すと公開前の確認へ進みます。'}</p></form>`;}

 const d=LIVE.dashboard;if(!d)return liveShell('団体の管理','<p>ログインしてください。</p>');

// Mirrors the server rules: drafts are edited directly; published activities only via a change request before they end.
function liveActivityEditable(a){const now=new Date().toISOString();return !a.changePending&&a.status!=='CANCELLED'&&(!a.publishedAt||(['PUBLISHED','CLOSED'].includes(a.status)&&!!a.endsAt&&a.endsAt>now));}
function liveActivityCancellable(a){return ['PUBLISHED','CLOSED'].includes(a.status)&&!!a.endsAt&&a.endsAt>new Date().toISOString();}
function liveManagedActivity(a){return `<article class="card live-card"><h3>${escapeHtml(a.title)}</h3>${liveBadge(a.status)}${a.changePending?'<span class="badge badge-warn">変更確認中・受付保留</span>':''}<p>${escapeHtml(liveDate(a.startsAt))}</p>${a.reviewNote?`<p>運営から：${escapeHtml(a.reviewNote)}</p>`:''}<div class="live-navigation">${liveActivityEditable(a)?`<button class="btn btn-secondary btn-sm" data-nav="org" data-param="edit-${a.id}">内容を編集</button>`:''}<button class="btn btn-secondary btn-sm" data-live-act="duplicate" data-id="${a.id}">前回の募集を複製</button>${a.status==='DRAFT'?`<button class="btn btn-primary btn-sm" data-live-act="submit" data-id="${a.id}">審査を依頼</button>`:''}${a.status==='PUBLISHED'?`<button class="btn btn-ghost btn-sm" data-live-act="close" data-id="${a.id}">募集を終了</button><button class="btn btn-secondary btn-sm" data-offer-compose="${a.id}">活動へのオファー</button>`:''}${liveActivityCancellable(a)?`<button class="btn btn-ghost btn-sm" data-activity-cancel="${a.id}">開催を中止</button>`:''}</div></article>`;}
function liveApplicationCard(p){return `<article class="card live-card"><h3>${escapeHtml(p.title)}</h3>${liveBadge(p.status)}${conditionReceiptHTML(p)}<p>${escapeHtml(liveDate(p.activity.startsAt))} 〜 ${escapeHtml(liveDate(p.activity.endsAt))}</p>${p.status==='EXPIRED'?'<p class="hint">開催終了までに承認されなかったため、受付終了になりました。</p>':''}${p.status==='APPROVED'&&p.activity.endsAt<=new Date().toISOString()?'<p class="hint">開催は終了しました。担当者による参加完了の確認を待っています。</p>':''}<p>${escapeHtml(p.kind)} ／ ${escapeHtml(p.owned?p.nickname:p.community_name)}</p><p class="live-copy">${escapeHtml(p.message)}</p>${p.minor?'<p class="hint">18歳未満・保護者同意の申告あり。団体は承認前に同意を確認してください。</p>':''}${p.activity.location?`<div class="live-private"><b>参加者への案内</b><p>集合場所：${escapeHtml(p.activity.location)}</p><p>緊急連絡先：${escapeHtml(p.activity.emergency)}</p></div>`:''}<div class="live-navigation">${p.owned||['APPROVED','DONE'].includes(p.status)?`<button class="btn btn-secondary btn-sm" data-live-room="${p.activity_id}">活動の連絡板</button>`:''}${p.owned&&p.status==='APPLIED'?`<button class="btn btn-primary btn-sm" data-live-app="approve" data-id="${p.id}" data-minor="${!!p.minor}">承認する</button><button class="btn btn-ghost btn-sm" data-live-app="decline" data-id="${p.id}">受入れ不可</button>`:''}${p.owned&&p.status==='APPROVED'&&p.activity.endsAt<=new Date().toISOString()?`<button class="btn btn-primary btn-sm" data-live-app="complete" data-id="${p.id}">活動完了を記録</button>`:''}${!p.owned&&p.status==='DONE'?(liveReviewControls(p.activity_id)+nextParticipationLink(p)):''}${!p.owned&&['APPLIED','APPROVED'].includes(p.status)?`<button class="btn btn-ghost btn-sm" data-live-app="cancel" data-id="${p.id}">申込みを取り消す</button>`:''}</div></article>`;}
function liveReviewPage(){
 if(LIVE.dashboard?.role!=='ADMIN')return liveShell('運営管理',LOCAL_APP?'<p>このアカウントには運営管理の権限がありません。管理者は、このパソコンで「運営管理者を設定.cmd」から指定してください。</p>':`<p>このアカウントには運営管理の権限がありません。運営権限が必要な場合は、アプリの管理者に次のアカウントIDを伝えてください。</p>${accountUser?`<p><code>${escapeHtml(accountUser.id)}</code></p>`:''}`);
 if(current.param==='new')return liveAdminRegistration();
 if(current.param?.startsWith('edit-'))return liveAdminRegistration(current.param.slice(5));
 const review=LIVE.review||{communities:[],activities:[]};
 return liveShell('運営管理・公開前の確認',`<p>代表者の本人確認や活動内容の確認を、実際に完了してから承認してください。確認理由は記録されます。</p><div class="live-admin-banner"><div><h2>コミュニティの登録・管理</h2><p>運営者が情報を登録し、内容を確認してから掲載します。</p></div><button class="btn btn-primary" data-nav="admin" data-param="new">＋ コミュニティを登録</button></div><a class="btn btn-secondary" href="/operator.html#/reports">相談・通報・変更依頼を確認</a><h2>登録した団体（${review.communities.length}件）</h2>${review.communities.map(c=>`<article class="card live-card"><h3>${escapeHtml(c.name)}</h3>${liveBadge(c.status)}<p>${escapeHtml(c.city)} ／ ${escapeHtml(c.type)}</p><p class="live-copy">${escapeHtml(c.intro)}</p>${liveBuzzSummary(c)}${livePhotos(c)}${officialSourcePanel(c,true)}${liveAdminNotes(c)}${pendingChangeHTML(c)}<div class="live-navigation"><button class="btn btn-secondary" data-nav="admin" data-param="edit-${c.id}">団体情報を編集</button><button class="btn btn-ghost" data-transfer-community="${c.id}">担当者を引き継ぐ</button><button class="btn btn-primary" data-live-review="community" data-id="${c.id}" data-action="approve">代表者を確認して承認</button><button class="btn btn-ghost" data-live-review="community" data-id="${c.id}" data-action="return">確認事項を返す</button><button class="btn btn-ghost" data-live-review="community" data-id="${c.id}" data-action="suspend">掲載を停止</button></div></article>`).join('')||'<p>登録された団体はありません。</p>'}${conditionReviewHTML()}<h2>募集の審査</h2>${review.activities.map(a=>`<article class="card live-card"><h3>${escapeHtml(a.title)}</h3><p>${escapeHtml(liveDate(a.startsAt))} 〜 ${escapeHtml(liveDate(a.endsAt))} ／ ${a.capacity}人</p>${liveReviewDetails(a)}<div class="live-navigation"><button class="btn btn-primary" data-live-review="activity" data-id="${a.id}" data-action="approve">確認して公開</button><button class="btn btn-ghost" data-live-review="activity" data-id="${a.id}" data-action="return">差し戻す</button></div></article>`).join('')||'<p>審査待ちの募集はありません。</p>'}`);
}
// Everything the organizer entered, so operators can review job listings and conditions, not only safety fields.
function liveReviewDetails(a){
 const pick=(map,k)=>map[k]||k,yesNo={unknown:'確認中',yes:'あり',no:'なし'};
 const rows=[['募集の種類',isCareerListing(a)?pick(COMPANY_KINDS,a.companyKind):pick(COMMUNITY_ACTIVITY_TYPES,a.activityKind||'activity')],['ジャンル',a.genre],
  ['団体外からの参加',{unknown:'確認中・参加条件に記載',open:'団体に入っていなくても参加できる',members:'所属メンバーのみ'}[a.participationScope||'unknown']],
  ['開催頻度',{single:'単発',continuous:'継続'}[a.frequency]],['会場の市町村',a.activityCity],['申込期限',a.deadline&&liveDate(a.deadline)],
  ['対象学年',(a.targetYears||[]).join('・')],['高校生の参加',HIGH_SCHOOL_LABELS[a.highSchoolParticipation||'unknown']],
  ['目的',a.purpose],['作業',a.tasks],['責任者',a.staff],['条件',a.requirements],['持ち物',a.belongings],['危険性',a.risk],['保険',a.insurance],['撮影',a.photoPolicy],
  ['交通',a.transport],['駐車場',a.parking&&a.parking!=='unknown'?yesNo[a.parking]:''],['交通費',a.transportFee],['禁止事項',a.prohibited],['集合場所',a.location],['緊急連絡先',a.emergency],
  ['参加費',[a.fees,Number.isFinite(a.feeAmount)&&a.feeAmount>0?a.feeAmount.toLocaleString('ja-JP')+'円':''].filter(Boolean).join(' ／ ')],['報酬・謝礼・給与',a.remuneration],
  ['職種・体験する仕事',a.companyRole],['雇用形態',a.employmentType],['勤務地',a.workplace],['勤務時間',a.workSchedule],['選考の流れ',a.selectionProcess],
  ['初参加歓迎',a.beginner?'はい':''],['手伝い募集',a.help?'はい':'']];
 return rows.filter(([,v])=>v).map(([l,v])=>`<p class="live-copy"><b>${l}：</b>${escapeHtml(String(v))}</p>`).join('')+(a.applicationURL?`<p class="live-copy"><b>公式応募URL：</b><a href="${escapeHtml(a.applicationURL)}" target="_blank" rel="noopener noreferrer">${escapeHtml(a.applicationURL)}</a></p>`:'');
}
function liveCommunityFacts(c){return '<div class="live-details">'+Object.entries({genres:'活動ジャンル',schedule:'普段の活動日時',audience:'参加対象',welcome:'初参加の方へ',transport:'アクセス'}).filter(([k])=>Array.isArray(c[k])?c[k].length:c[k]).map(([k,label])=>'<section class="card live-card"><h3>'+label+'</h3><p class="live-copy">'+escapeHtml(Array.isArray(c[k])?c[k].join('・'):c[k])+'</p></section>').join('')+'</div>';}
function liveAdminNotes(c){const info=c.adminInfo||{};return '<details class="live-admin-private"><summary>運営用の連絡先・確認メモ（非公開）</summary>'+Object.entries({representative:'代表者・連絡担当者',email:'メール',phone:'電話',source:'情報の入手先・確認方法',notes:'運営メモ'}).map(([k,l])=>'<p class="live-copy"><b>'+l+'：</b>'+escapeHtml(info[k]||'未入力')+'</p>').join('')+'<p>掲載同意：'+(info.consentConfirmed?'確認済み':'未確認')+'</p></details>';}
async function liveAction(route,data={},button){

 const search=document.getElementById('liveSearch');if(search)search.onsubmit=e=>{e.preventDefault();liveQuery=document.getElementById('liveKeyword').value;liveOnlyFollowed=!!document.getElementById('liveOnlyFollowed')?.checked;render();};
 const cf=document.getElementById('liveCommunityForm');if(cf){cf.addEventListener('invalid',event=>{let parent=event.target.parentElement;while(parent&&parent!==cf){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}},true);const c=LIVE.review?.communities.find(x=>x.id===cf.dataset.id)||{},read=bindCommunityMediaEditor(cf,c);cf.onsubmit=async e=>{e.preventDefault();const err=cf.querySelector('.live-form-error'),button=cf.querySelector('button[type=submit]');err.textContent='';try{const form=new FormData(cf),data=Object.fromEntries(form);data.genres=preserveCatalogueGenres(c.pendingChange?.genres||c.genres||[],form.getAll('genres'),data.sector);data.activityDays=form.getAll('activityDays');data.campusYears=form.getAll('campusYears');data.campusAllYears=cf.elements.campusAllYears.checked;data.beginnerWelcome=cf.elements.beginnerWelcome.checked;data.sponsorListed=cf.elements.sponsorListed.checked;data.officialUpdatesEnabled=cf.elements.officialUpdatesEnabled.checked;data.adminInfo=Object.fromEntries(['representative','email','phone','source','notes'].map(k=>[k,form.get(k)||'']));data.adminInfo.consentConfirmed=cf.elements.consentConfirmed.checked;Object.assign(data,read());button.disabled=true;await accountAPI('live/communities'+(cf.dataset.id?'/'+cf.dataset.id:''),'POST',data);await refreshLive(false);nav('admin');toast('団体情報を保存しました。確認後に公開できます');}catch(e){err.textContent=e.message;button.disabled=false;}};}

/* Separate participant and operator surfaces; server permissions remain authoritative. */
const OPERATOR_VIEWS=['manage','admin','org','orgSignup','participants','reports','waitingManage'];
function canOperate(){return LIVE.dashboard?.role==='ADMIN'||!!LIVE.dashboard?.communities?.length;}
function surfaceTarget(view,param){
  if(OPERATOR_APP&&view==='home')view='manage';
  if(OPERATOR_APP&&view==='register')view='login';
  const shared=['login','notifications'];
  const operator=OPERATOR_VIEWS.includes(view)||(OPERATOR_APP&&shared.includes(view));
  return {view,param,url:(operator?'/operator.html':'/')+'#/'+view+(param?'/'+encodeURIComponent(param):''),cross:operator!==OPERATOR_APP};
}
function routeToSurface(){
  const target=surfaceTarget(current.view,current.param);
  if(target.cross){location.replace(target.url);return true;}
  current.view=target.view;
  return false;
}
function surfaceRoutes(){
  if(!OPERATOR_APP)return ROUTES;
  if(!canOperate())return [];
  return [{id:'manage',label:'運営ホーム',icon:'home'},
    ...(LIVE.dashboard?.role==='ADMIN'?[{id:'admin',label:'団体・審査',icon:'shield'},{id:'reports',label:'相談対応',icon:'info'}]:[]),
    {id:'org',label:'募集管理',icon:'list'},

    {id:'notifications',label:'お知らせ',icon:'bell'}];
}

async function loadLiveReviews(feed,offset=0){

   feed.innerHTML=`<p>${result.total}件の口コミ${result.total?` ／ ${offset+1}〜${offset+result.reviews.length}件`:''}</p>${result.reviews.map(liveReviewCard).join('')||'<p>まだ口コミはありません。参加後の感想をお待ちしています。</p>'}<div class="live-navigation">${offset?`<button class="btn btn-ghost btn-sm" data-review-offset="${Math.max(0,offset-20)}">前の口コミ</button>`:''}${result.nextOffset!==null?`<button class="btn btn-secondary btn-sm" data-review-offset="${result.nextOffset}">次の口コミ</button>`:''}</div>`;
   feed.querySelectorAll('[data-review-offset]').forEach(b=>b.onclick=()=>loadLiveReviews(feed,Number(b.dataset.reviewOffset)));
 }catch(e){if(!feed.isConnected||epoch!==accountEpoch)return;feed.innerHTML=`<p role="alert">${escapeHtml(e.message)}</p><button class="btn btn-ghost btn-sm" data-review-retry>もう一度読み込む</button>`;feed.querySelector('[data-review-retry]').onclick=()=>loadLiveReviews(feed,offset);}

function discoveryOptions(values,selected){return [...new Set(values.filter(Boolean))].map(v=>`<option value="${escapeHtml(v)}" ${v===selected?'selected':''}>${escapeHtml(v)}</option>`).join('');}
const DISCOVERY_CONDITIONS={beginner:'初心者歓迎',highSchool:'高校生も参加・見学可',single:'単発で参加',continuous:'継続して参加',free:'参加費無料',parking:'駐車場あり'};
function discoveryLocalDate(value){const d=new Date(value);return Number.isFinite(d.getTime())?new Date(d.getTime()+9*3600000).toISOString().slice(0,10):'';}
function discoveryDatesMatch(a){
 const f=discoveryFilters;if(!f.dateFrom&&!f.dateUntil)return true;
 if(!a||isRecruitment(a))return false;
 const start=discoveryLocalDate(a.startsAt),end=discoveryLocalDate(a.endsAt);if(!start||!end)return false;
 const from=f.dateFrom||f.dateUntil,until=f.dateUntil||f.dateFrom;
 return start<=until&&end>=from;
}
function discoveryParticipationMatch(c,a){
 const f=discoveryFilters,checks=[];
 if(f.day)checks.push(a?!isRecruitment(a)&&['日','月','火','水','木','金','土'][new Date(discoveryLocalDate(a.startsAt)+'T00:00:00Z').getUTCDay()]===f.day:(c.activityDays||[]).includes(f.day));
 if(f.year)checks.push(a?!(a.targetYears||[]).length||a.targetYears.includes(f.year):c.campusAllYears===true||(c.campusYears||[]).includes(f.year));
 const frequency=a?a.frequency:c.campusFrequency,school=a?a.highSchoolParticipation:c.campusHighSchoolAccess;
 const values={beginner:a?a.beginner===true:c.beginnerWelcome===true,highSchool:['visit','allowed'].includes(school),single:frequency==='single',continuous:frequency==='continuous',free:(a?a.feeAmount:c.campusFeeAmount)===0,parking:(a?a.parking:c.campusParking)==='yes'};
 for(const tag of f.conditions||[])checks.push(values[tag]===true);
 return !checks.length||(f.matchMode==='any'?checks.some(Boolean):checks.every(Boolean));
}
function discoveryMatches(c,a,sector){
 const f=discoveryFilters;if(sector&&discoverySector(c)!==sector)return false;
 if(sector==='campus'?f.university&&!discoveryUniversities(c).includes(f.university):f.city&&c.city!==f.city)return false;
 if(f.genre&&!catalogueGenreMatches(f.genre,[...(c.genres||[]),a?.genre],sector))return false;
 if(sector==='company'&&f.companyKind&&a&&!(COMPANY_SEARCH_KINDS[f.companyKind]?.kinds||[f.companyKind]).includes(a.companyKind||'regional'))return false;
 const terms=normalizeKeyword(f.keyword).trim().split(/\s+/).filter(Boolean),haystack=normalizeKeyword([c.name,c.intro,c.localContribution,c.city,c.type,c.campusName,...discoveryUniversities(c),...(c.genres||[]),a?.title,a?.purpose,a?.tasks,a?.genre,a?.companyRole,a?.workplace,a?.employmentType].join(' '));
 if(!terms.every(t=>haystack.includes(t)))return false;
 return !a||discoveryDatesMatch(a)&&discoveryParticipationMatch(c,a);
}
function discoveryActivities(sector){return (LIVE.catalog.activities||[]).filter(a=>{const c=liveOrgById(a.communityId);return c&&discoveryMatches(c,a,sector)&&(!liveOnlyFollowed||LIVE.dashboard?.follows?.includes(c.id));});}
function discoveryCommunities(sector){return (LIVE.catalog.communities||[]).filter(c=>{
 if(liveOnlyFollowed&&!LIVE.dashboard?.follows?.includes(c.id))return false;
 const f=discoveryFilters,constrained=f.day||f.year||f.conditions.length||f.dateFrom||f.dateUntil||sector==='company'&&f.companyKind;
 const base=discoveryMatches(c,null,sector),activities=(LIVE.catalog.activities||[]).filter(a=>a.communityId===c.id);
 if(!constrained)return base||activities.some(a=>discoveryMatches(c,a,sector));
 const regular=base&&!f.dateFrom&&!f.dateUntil&&!(sector==='company'&&f.companyKind)&&discoveryParticipationMatch(c,null);
 return regular||activities.some(a=>discoveryMatches(c,a,sector));
});}

 return `<section class="discovery-compare"><h2>気になる大学を比べる</h2><p>最大3校。掲載されているサークルと大学生活の情報を見比べられます。</p><div class="discovery-compare-picker"><label for="compareUniversity">大学<select id="compareUniversity"><option value="">大学を選択</option>${discoveryOptions([...GUNMA_UNIVERSITIES,...registered.flatMap(discoveryUniversities)],'')}</select></label><button class="btn btn-secondary" data-compare-add ${comparedUniversities.length>=3?'disabled':''}>比較に追加</button></div>${comparedUniversities.length?`<div class="discovery-comparison">${comparedUniversities.map(u=>{const groups=registered.filter(c=>discoveryUniversities(c).includes(u));return `<article class="card"><h3>${escapeHtml(u)}</h3><p>掲載 ${groups.length}団体</p>${groups.length?`<ul>${groups.map(c=>`<li><a href="#/livecommunity/${encodeURIComponent(c.id)}">${escapeHtml(c.name)}</a><p class="hint">${escapeHtml((c.genres||[]).join('・')||'ジャンル確認中')}<br>${escapeHtml(c.schedule||'活動頻度：確認中')}<br>${escapeHtml(c.fees||'費用：確認中')}</p></li>`).join('')}</ul>`:'<p>掲載情報を準備中です。サークルがないことを示すものではありません。</p>'}<button class="btn btn-ghost btn-sm" data-compare-remove="${escapeHtml(u)}">比較から外す</button></article>`;}).join('')}</div>`:'<p class="hint">比較したい大学を追加してください。大学の優劣をつける機能ではありません。</p>'}</section>`;
}
function discoveryMapPoint(a){const c=liveOrgById(a.communityId);return c?.publicPoint||PUBLIC_MAP_POINTS[c?.city]||null;}
function discoveryMapList(){return discoveryActivities().filter(a=>!circleSearch||discoveryMapPoint(a)&&distanceInMeters(circleSearch.center,discoveryMapPoint(a))<=circleSearch.radius);}
function discoveryMapResultsHTML(){const items=discoveryMapList(),missing=discoveryActivities().filter(a=>!discoveryMapPoint(a)).length;return `<p role="status">${circleSearch?'円の範囲内':'検索条件に合う'} ${items.length}件</p>${missing?`<p class="hint">${missing}件は公開エリアを確認中です。${circleSearch?'範囲検索には含みません。':'地図のピンは表示せず、一覧に表示します。'} <a href="#/list">一覧で確認</a></p>`:''}<div class="act-grid">${items.map(liveCard).join('')||'<p>該当する活動はありません。範囲や条件を広げてみてください。</p>'}</div>`;}
function discoveryMapHTML(){return `<div class="circle-map-tools"><button class="btn btn-primary" id="discoveryDraw" aria-pressed="false">円で囲んで探す</button><button class="btn btn-secondary" id="discoveryCenter">中央を囲む</button><button class="btn btn-ghost" id="discoveryClear">範囲を解除</button><a class="btn btn-ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('群馬県 '+discoveryFilters.city)}" target="_blank" rel="noopener noreferrer">Googleマップで地域を見る ↗</a></div><p id="discoveryMapHint" role="status">円を描くボタンを押してドラッグ。タップだけなら半径5kmです。</p><label class="discovery-radius">半径 <output id="discoveryRadiusLabel">${circleSearch?circleSearch.radius/1000:5}km</output><input id="discoveryRadius" type="range" min="0.5" max="50" step="0.5" value="${circleSearch?circleSearch.radius/1000:5}"></label><div id="discoveryMap" class="circle-search-map" aria-label="大まかな公開エリアの地図"></div><p class="hint">市町村の目安の位置、または団体が指定した約1km単位の公開位置で検索します。正確な集合場所は承認後に案内します。</p><p id="discoveryMapNetwork" role="status" class="hint"></p><div id="discoveryMapResults">${discoveryMapResultsHTML()}</div>`;}
function discoveryGroupedCommunitiesHTML(communities){return `<p class="discovery-total" role="status">掲載コミュニティ <strong>${communities.length}</strong>件<span>募集がない団体も見られます。</span></p>${Object.entries(DISCOVERY_SECTORS).map(([sector,label])=>{const items=communities.filter(c=>discoverySector(c)===sector);return `<section class="discovery-group" data-community-sector="${sector}" aria-labelledby="group-${sector}"><div class="section-head"><h2 id="group-${sector}">${label} <small>${items.length}件</small></h2><a class="btn btn-secondary btn-sm" href="#/${sector}">${label}で探す →</a></div><div class="act-grid">${items.map(discoveryCommunityCard).join('')||'<p class="discovery-empty">この条件の掲載情報はありません。</p>'}</div></section>`;}).join('')}`;}
function viewDiscoveryPage(){
 if(!ACCOUNT_SERVER||!['list','map','campus','company','regional','live'].includes(current.view))return null;
 const campus=current.view==='campus',map=current.view==='map',sector=['campus','company','regional'].includes(current.view)?current.view:null;
 syncDiscoveryFilterScope(sector);
 if(campus&&current.param)discoveryFilters.university=current.param;
 const title=campus?'大学・サークルを探す':map?'地図で活動を探す':sector==='company'?'企業を探す':sector==='regional'?'地域コミュニティを探す':'活動を探す';
 const description=campus?'大学のホームページを行き来せず、気になるサークルと大学生活を見比べよう。高校生も登録せずに見られます。':sector==='company'?'まちづくり・地元の産業・地域の暮らしに関わる企業とのつながりを。共同活動、見学、インターンや採用情報も紹介します。':'運営が確認した団体と、参加を受け付けている活動を探せます。';
 if(!LIVE.loaded)return liveShell(title,'<p role="status">情報を読み込んでいます…</p>');
 if(LIVE.error&&!LIVE.fetchedAt)return liveShell(title,`<p class="live-form-error" role="alert">情報を読み込めませんでした。通信状況を確認して、もう一度お試しください。</p><button class="btn btn-secondary" data-live-refresh>もう一度読み込む</button>`);
 const staleNote=LIVE.error?`<p class="live-form-error" role="alert">最新の情報を読み込めませんでした。前回読み込んだ内容を表示しています。 <button class="btn btn-secondary btn-sm" data-live-refresh>もう一度読み込む</button></p>`:'',shell=(t,h)=>liveShell(t,staleNote+h);
 const communities=discoveryCommunities(sector),activities=discoveryActivities(sector);
 if(!sector&&!map)return shell(title,`<p class="discovery-lead">地域コミュニティ、大学・サークル、企業。気になるつながりを見つけよう。</p><nav class="discovery-tabs" aria-label="探す目的"><a href="#/list" aria-current="page">すべて</a>${Object.entries(DISCOVERY_SECTORS).map(([k,v])=>`<a href="#/${k}">${v}</a>`).join('')}</nav>${discoverySimpleSearchHTML()}${discoveryGroupedCommunitiesHTML(communities)}<details class="discovery-all-activities"><summary>参加できる活動を見る（${activities.length}件）</summary><a class="btn btn-ghost" href="#/map">地図で見る</a><div class="act-grid">${activities.map(liveCard).join('')||'<p>この条件の募集はありません。</p>'}</div></details>${serendipityEntryHTML()}`);
 return shell(title,`<p class="discovery-lead">${description}</p><nav class="discovery-tabs" aria-label="探す目的"><a href="#/list" ${!sector?'aria-current="page"':''}>すべて</a>${Object.entries(DISCOVERY_SECTORS).map(([k,v])=>`<a href="#/${k}" ${sector===k?'aria-current="page"':''}>${v}</a>`).join('')}</nav>${!sector&&!map?serendipityEntryHTML():''}${sector==='company'?companyKindPicker():''}${discoveryFilterHTML(campus)}${campus?`<p class="hint">情報を見ることと活動への参加は別です。高校生の参加・見学可否は募集ごとに表示します。大学公認とトビヨリの確認も分けて案内します。</p><p role="status">${communities.length}団体の紹介</p><div class="act-grid">${communities.map(discoveryCommunityCard).join('')||'<div class="card live-card"><h2>この条件の情報は準備中です</h2><p>未掲載の大学もあります。サークルが存在しないという意味ではありません。</p></div>'}</div>${universityCompareHTML()}`:map?discoveryMapHTML():`<div class="section-head"><h2>${sector==='company'?'地域とつながる募集':sector==='regional'?'地域団体のイベント・ボランティア':'参加できる活動'} <small>${activities.length}件</small></h2><a class="btn btn-ghost" href="#/map">地図で見る</a></div><div class="act-grid">${activities.map(liveCard).join('')||'<div class="card live-card"><p>この条件の募集はありません。条件を減らすか、団体の紹介をご覧ください。</p></div>'}</div><h2 class="discovery-section-title">コミュニティの紹介 <small>${communities.length}件</small></h2><p>募集がない団体も紹介しています。</p><div class="act-grid">${communities.map(discoveryCommunityCard).join('')||'<p>この条件の団体はまだ掲載されていません。</p>'}</div>`}`);
}
function bindDiscoveryUI(scope){
 const form=scope.querySelector('#discoverySearch');
 if(form){form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),from=String(data.get('dateFrom')||''),until=String(data.get('dateUntil')||'');if(from&&until&&from>until){scope.querySelector('#discoverySearchError').textContent='終了日は開始日以降にしてください。';form.elements.dateUntil.focus();return;}for(const k of Object.keys(discoveryFilters))discoveryFilters[k]=k==='conditions'?data.getAll(k):String(data.get(k)||'');liveOnlyFollowed=data.has('followed');current.param=null;render();};
  const reset=scope.querySelector('[data-discovery-reset]');if(reset)reset.onclick=()=>{for(const k of Object.keys(discoveryFilters))discoveryFilters[k]=k==='conditions'?[]:k==='matchMode'?'all':'';current.param=null;liveOnlyFollowed=false;circleSearch=null;render();};
 }
 scope.querySelectorAll('[data-company-kind]').forEach(b=>b.onclick=()=>{form.elements.companyKind.value=b.dataset.companyKind;form.requestSubmit();});
 scope.querySelector('[data-compare-add]')?.addEventListener('click',()=>{const u=scope.querySelector('#compareUniversity').value;if(u&&!comparedUniversities.includes(u)&&comparedUniversities.length<3){comparedUniversities.push(u);render();}});
 scope.querySelectorAll('[data-compare-remove]').forEach(b=>b.onclick=()=>{comparedUniversities=comparedUniversities.filter(u=>u!==b.dataset.compareRemove);render();});
 if(scope.querySelector('#discoveryMap'))bindDiscoveryMap();
}
function bindDiscoveryMap(){
 const box=document.getElementById('discoveryMap'),hint=document.getElementById('discoveryMapHint');
 if(typeof L==='undefined'){box.innerHTML='<p class="empty-state">地図を読み込めませんでした。下の一覧から活動を探せます。</p>';return;}
 const map=L.map(box,{scrollWheelZoom:false,minZoom:7,maxZoom:15});activeCircleMap=map;
 map.setView(circleSearch?.center||PUBLIC_MAP_POINTS[discoveryFilters.city]||[36.36,139.16],discoveryFilters.city?12:10);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map).on('tileerror',()=>document.getElementById('discoveryMapNetwork').textContent='背景地図の読み込みに失敗しました。下の一覧、またはGoogleマップで地域を確認できます。');
 const markers=L.layerGroup().addTo(map);let layer=null,drawing=false,pointer=null;
 const draw=document.getElementById('discoveryDraw'),range=document.getElementById('discoveryRadius');
 function repaint(){if(layer)map.removeLayer(layer);layer=circleSearch?L.circle(circleSearch.center,{radius:circleSearch.radius,color:'#075333',fillColor:'#C7F238',fillOpacity:.2}).addTo(map):null;markers.clearLayers();
  const groups=new Map();for(const a of discoveryMapList()){const point=discoveryMapPoint(a);if(!point)continue;const k=point.join(',');if(!groups.has(k))groups.set(k,{point,items:[]});groups.get(k).items.push(a);}
  for(const {point,items} of groups.values()){const body=document.createElement('div');for(const a of items){const link=document.createElement('a');link.className='map-activity-link';link.href='#/liveactivity/'+encodeURIComponent(a.id);link.textContent=a.title;body.append(link);}L.circleMarker(point,{radius:10,fillColor:'#075333',color:'#fff',fillOpacity:1,weight:3}).addTo(markers).bindPopup(body);}
  document.getElementById('discoveryMapResults').innerHTML=discoveryMapResultsHTML();bindGlobalActions(document.getElementById('discoveryMapResults'));
  range.disabled=!circleSearch;range.value=circleSearch?circleSearch.radius/1000:5;document.getElementById('discoveryRadiusLabel').textContent=circleSearch?circleSearch.radius/1000+'km':'未指定';
 }
 function drawMode(on){drawing=on;draw.setAttribute('aria-pressed',String(on));draw.textContent=on?'描くのをやめる':'円で囲んで探す';box.classList.toggle('circle-drawing',on);map.dragging[on?'disable':'enable']();map.touchZoom[on?'disable':'enable']();map.doubleClickZoom[on?'disable':'enable']();hint.textContent=on?'中心から外側へドラッグしてください。':'円の半径を調整できます。';}
 const coords=e=>{const p=map.mouseEventToLatLng(e);return [p.lat,p.lng];};
 draw.onclick=()=>drawMode(!drawing);document.getElementById('discoveryCenter').onclick=()=>{const p=map.getCenter();circleSearch={center:[p.lat,p.lng],radius:5000};drawMode(false);repaint();};document.getElementById('discoveryClear').onclick=()=>{circleSearch=null;drawMode(false);repaint();};range.oninput=()=>{if(circleSearch){circleSearch.radius=Number(range.value)*1000;repaint();}};
 box.addEventListener('pointerdown',e=>{if(!drawing||e.button>0||e.target.closest('.leaflet-control'))return;e.preventDefault();e.stopPropagation();pointer={id:e.pointerId,x:e.clientX,y:e.clientY,previous:circleSearch};circleSearch={center:coords(e),radius:500};box.setPointerCapture(e.pointerId);repaint();},true);
 box.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();circleSearch.radius=Math.min(50000,Math.max(500,Math.round(distanceInMeters(circleSearch.center,coords(e))/500)*500));repaint();},true);
 box.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)<8)circleSearch.radius=5000;pointer=null;if(box.hasPointerCapture(e.pointerId))box.releasePointerCapture(e.pointerId);drawMode(false);repaint();},true);
 box.addEventListener('pointercancel',()=>{if(pointer){circleSearch=pointer.previous;pointer=null;drawMode(false);repaint();}});box.tabIndex=0;box.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pointer)circleSearch=pointer.previous;pointer=null;drawMode(false);repaint();draw.focus();}});map.invalidateSize();repaint();
}
function communityDiscoveryFields(c){return `<section class="card live-card"><h2>探し方・大学生活の情報</h2>${liveSelect('sector','掲載する入口',discoverySector(c),Object.keys(DISCOVERY_SECTORS)).replace(/>regional</g,'>地域コミュニティ<').replace(/>campus</g,'>大学・サークル<').replace(/>company</g,'>企業<')}<div class="live-form-grid">${liveField('localContribution','地域とのつながり・取り組み',c.localContribution||'','textarea')}${liveField('campusName','活動キャンパス',c.campusName||'')}${liveField('partnerUniversities','関連大学（複数の場合は「、」で区切る）',(c.partnerUniversities||[]).join('、'))}${liveField('fees','普段の活動費・会費',c.fees||'')}${liveField('highSchoolVisits','高校生向けの見学・公開イベント',c.highSchoolVisits||'')}</div><label for="lf_recognition">大学公認などの区分<select id="lf_recognition" name="recognition">${Object.entries(RECOGNITION_LABELS).map(([k,v])=>`<option value="${k}" ${c.recognition===k?'selected':''}>${v}</option>`).join('')}</select></label>${liveField('recognitionSource','大学公認の根拠となる公式ページ',c.recognitionSource||'','url')}${campusParticipationFields(c)}${liveField('sourceURL','紹介内容の情報源（公式HPなど）',c.sourceURL||'','url')}<p class="hint">地域の企業は、関わっている地域や地域課題、地元での取り組みを紹介してください。例：空き店舗の活用、地元の農産物の商品づくり、商店街との共同企画。大学公認は公式情報を確認して登録してください。トビヨリの掲載確認とは別の情報です。</p><details><summary>地図に表示する大まかな公開エリア</summary>${liveField('publicArea','公開エリアの説明（例：高崎駅周辺）',c.publicArea||'')}<div class="live-form-grid">${liveField('publicLat','公開エリアの緯度',c.publicPoint?.[0]?.toString()||'')}${liveField('publicLng','公開エリアの経度',c.publicPoint?.[1]?.toString()||'')}</div><p class="hint">任意。正確な集合場所を入力しないでください。位置は約1km単位に丸めて公開します。未設定の場合、一部市町村は代表点を表示します。</p></details></section>`;}
function activityDiscoveryFields(a){return `${companyListingFields(a)}<fieldset class="discovery-activity-fields"><legend>参加前に知っておきたいこと</legend><div class="live-form-grid">${liveField('fees','参加費（無料の場合は「無料」）',a.fees||'')}${liveField('remuneration','報酬・謝礼（ない場合は「なし」）',a.remuneration||'')}${liveField('transportFee','交通費の補助',a.transportFee||'')}</div><label>高校生の参加<select name="highSchoolParticipation">${Object.entries(HIGH_SCHOOL_LABELS).map(([k,v])=>`<option value="${k}" ${a.highSchoolParticipation===k?'selected':''}>${v}</option>`).join('')}</select></label><label>単発・継続<select name="frequency"><option value="single" ${a.frequency!=='continuous'?'selected':''}>単発</option><option value="continuous" ${a.frequency==='continuous'?'selected':''}>継続</option></select></label><label>駐車場<select name="parking">${Object.entries({unknown:'確認中',yes:'あり',no:'なし'}).map(([k,v])=>`<option value="${k}" ${a.parking===k?'selected':''}>${v}</option>`).join('')}</select></label><fieldset><legend>大学生の対象学年（未選択なら大学生の学年不問）</legend>${STUDENT_YEARS.map(y=>`<label class="discovery-inline"><input name="targetYears" type="checkbox" value="${y}" ${(a.targetYears||[]).includes(y)?'checked':''}>${y}</label>`).join('')}</fieldset><p class="hint">高校生が参加できるかは、上の「高校生の参加」で別に設定します。採用・求人の応募は、公式ページで締切まで受け付けます。その他の参加申込みは開催開始までです。</p></fieldset>`;}
function communityDiscoveryFacts(c){return `<section class="live-verification"><h2>${discoverySector(c)==='campus'?'大学生活・サークル情報':'参加前の情報'}</h2><dl class="discovery-facts">${c.localContribution?`<div><dt>地域とのつながり</dt><dd class="live-copy">${escapeHtml(c.localContribution)}</dd></div>`:''}${Object.entries({campusName:'活動キャンパス',schedule:'活動頻度',fees:'会費・費用',highSchoolVisits:'高校生の見学'}).map(([k,l])=>`<div><dt>${l}</dt><dd>${escapeHtml(c[k]||'確認中')}</dd></div>`).join('')}</dl>${discoverySector(c)==='campus'?`<p>普段の曜日：${escapeHtml((c.activityDays||[]).join('・')||'確認中')}${c.beginnerWelcome?' ／ 初心者歓迎':''}</p><p>${RECOGNITION_LABELS[c.recognition]||RECOGNITION_LABELS.unconfirmed}</p>${c.recognitionSource?`<a href="${escapeHtml(c.recognitionSource)}" target="_blank" rel="noopener noreferrer">大学公認の公式情報 ↗</a>`:''}`:''}${c.sourceURL?`<p><a href="${escapeHtml(c.sourceURL)}" target="_blank" rel="noopener noreferrer">紹介内容の公式情報 ↗</a></p>`:''}<p class="hint">募集がない期間も紹介を掲載しています。高校生の参加可否は各募集で確認してください。</p></section>`;}
