function openServiceReport(cid,aid='',kind='相談'){
 if(!accountUser){nav('login');return;}
 openModal(`<div class="modal-head"><h3>運営に相談・通報</h3><button class="modal-close" data-modal-close aria-label="閉じる">✕</button></div><p>内容は一般公開せず、対象団体にも共有しません。運営は対応のためアカウントと照合できます。</p><form id="serviceReportForm"><label>種類<select name="kind">${['相談','通報','事故','変更依頼'].map(v=>`<option ${kind===v?'selected':''}>${v}</option>`).join('')}</select></label>${liveField('body','内容','','textarea',true)}<p class="hint">この窓口の即時対応は保証できません。緊急時は地域の緊急窓口へ連絡してください。</p><p class="live-form-error" role="alert"></p><button class="btn btn-primary" type="submit">運営へ送信</button></form>`,root=>{const f=root.querySelector('form');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{await accountAPI('live/reports','POST',{communityId:cid,activityId:aid,kind:f.elements.kind.value,body:f.elements.body.value});closeModal();nav('support');toast('運営の相談受付に保存しました。対応状況を確認できます。');}catch(e){f.querySelector('.live-form-error').textContent=e.message;b.disabled=false;}};});
}
function openServiceBlock(cid){if(!accountUser){nav('login');return;}openModal(`<div class="modal-head"><h3>団体をブロックしますか？</h3><button class="modal-close" data-modal-close aria-label="閉じる">✕</button></div><p>この団体の検索表示・新着通知・招待を止め、フォローを解除します。申込み中・参加予定の活動は取り消され、連絡板も利用できなくなります。参加完了の履歴は残ります。</p><button class="btn btn-danger" id="confirmServiceBlock">取り消してブロック</button>`,root=>{root.querySelector('button#confirmServiceBlock').onclick=async e=>{if(await liveAction('blocks/'+cid,{block:true},e.target)){closeModal();nav('support');}};});}
function pendingChangeHTML(c){if(!c.pendingChange)return '';const p=c.pendingChange;return `<details class="live-pending-change"><summary>公開中の情報を保ったまま、変更案を確認中</summary><p>下の公開中の内容と見比べてから承認してください。</p>${Object.entries({name:'団体名',city:'地域',intro:'紹介文',campusName:'キャンパス',fees:'費用',highSchoolVisits:'高校生の見学',recognition:'公認区分',recognitionSource:'公認の公式情報',sourceURL:'情報源',officialUpdatesEnabled:'公式サイトからの自動取得',feedURL:'更新用URL',schedule:'活動頻度',audience:'対象',welcome:'受入れ方針',transport:'アクセス'}).map(([k,l])=>`<p><b>${l}</b><br>現在：${escapeHtml(c[k]||'未入力')}<br>変更案：${escapeHtml(p[k]||'未入力')}</p>`).join('')}<p><b>公式リンクの変更案</b></p>${Object.entries(p.links||{}).map(([k,v])=>`<p>${escapeHtml(k)}：${escapeHtml(v)}</p>`).join('')}${livePhotos(p)}</details>`;}
function offerSettingsHTML(p){return `<section class="card live-card"><h2>コミュニティからのオファー</h2><p>確認済みのコミュニティから、興味や希望地域に合う活動への招待を受け取れます。団体にプロフィール一覧や個人情報を見せることはありません。</p><label class="account-consent"><input id="pf_receiveOffers" type="checkbox" ${p.receiveOffers===true?'checked':''}><span>オファーを受け取る（任意）</span></label><label class="account-consent"><input id="pf_receiveCompanyOffers" type="checkbox" ${p.receiveCompanyOffers===true?'checked':''}><span>企業が主催する地域活動のオファーも受け取る</span></label><label class="account-consent"><input id="pf_receiveCareerOffers" type="checkbox" ${p.receiveCareerOffers===true?'checked':''}><span>採用・インターン・仕事を知るオファーも受け取る</span></label><p class="hint">保存すると設定が反映されます。1週間に最大3件。見送っても不利益はなく、受取りはいつでも止められます。応募するまで団体にあなたの反応は伝わりません。</p><a class="btn btn-secondary btn-sm" href="#/offers">届いたオファーを見る</a></section>`;}
function openOfferComposer(aid){openModal(`<div class="modal-head"><h3>活動へのオファーを送る</h3><button class="modal-close" data-modal-close aria-label="閉じる">✕</button></div><p>受取りを希望し、条件に合う利用者へ招待を届けます。対象者の名前・連絡先・プロフィール一覧は表示しません。</p><form id="offerComposer"><label>興味<select name="interest"><option value="">指定しない</option>${communityInterestChoices().map(([k,v])=>`<option value="${escapeHtml(k)}">${escapeHtml(v.label)}</option>`).join('')}</select></label><label>得意分野<select name="skill"><option value="">指定しない</option>${PROFILE_SKILLS.map(([id,label])=>`<option value="${id}">${escapeHtml(label)}</option>`).join('')}</select></label><label>希望地域<select name="city"><option value="">指定しない</option>${discoveryOptions(GUNMA_MUNICIPALITIES,'')}</select></label>${liveField('body','招待文（参加を強制する表現や個人SNSへの誘導は禁止）','','textarea',true)}<p class="hint">興味・地域・得意分野のいずれかを指定してください。選んだすべての条件に合い、必要な受取り設定をした人が対象です。1団体につき24時間に1回、同じ募集は同じ人に再送しません。</p><p class="live-form-error" role="alert"></p><button class="btn btn-primary" type="submit">条件に合う人へ送る</button></form>`,root=>{const f=root.querySelector('form');f.elements.body.maxLength=500;f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const r=await accountAPI('live/offers/'+aid+'/send','POST',Object.fromEntries(new FormData(f)));closeModal();toast(r.sent?r.sent+'人に活動の招待を送りました。':'受取り設定・条件・上限に合う利用者はいませんでした。');}catch(e){f.querySelector('.live-form-error').textContent=e.message;b.disabled=false;}};});}
function bindSupportUI(scope){
 scope.querySelectorAll('[data-live-report]').forEach(b=>b.onclick=()=>openServiceReport(b.dataset.liveReport,b.dataset.reportActivity));
 scope.querySelectorAll('[data-live-block]').forEach(b=>b.onclick=()=>openServiceBlock(b.dataset.liveBlock));
 scope.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{if(await liveAction('blocks/'+b.dataset.unblock,{block:false},b))render();});
 scope.querySelectorAll('[data-change-request]').forEach(b=>b.onclick=()=>openServiceReport(b.dataset.changeRequest,'','変更依頼'));
 scope.querySelectorAll('[data-offer-compose]').forEach(b=>b.onclick=()=>openOfferComposer(b.dataset.offerCompose));
 scope.querySelectorAll('[data-activity-cancel]').forEach(b=>b.onclick=()=>openModal(`<div class="modal-head"><h3>活動を中止する</h3><button class="modal-close" data-modal-close>✕</button></div><p>承認済みの方も含めて申込みを取り消し、理由を通知します。</p><form id="activityCancelForm">${liveField('reason','中止の理由','','textarea',true)}<button class="btn btn-danger">中止を確定する</button></form>`,root=>{root.querySelector('form').onsubmit=async e=>{e.preventDefault();if(await liveAction('activities/'+b.dataset.activityCancel+'/cancel',{reason:e.target.elements.reason.value},e.target.querySelector('button'))){closeModal();render();}};}));
 scope.querySelectorAll('[data-transfer-community]').forEach(b=>b.onclick=()=>openModal(`<div class="modal-head"><h3>団体の担当者を引き継ぐ</h3><button class="modal-close" data-modal-close>✕</button></div><p>引継ぎ先の同意を確認してから、登録済みのメールアドレスを指定します。募集・参加者対応の権限が移ります。運営管理者の権限は付与しません。</p><form>${liveField('email','引継ぎ先の登録メールアドレス','','email',true)}<label class="account-consent"><input type="checkbox" required>本人と引継ぎ内容を確認しました</label><button class="btn btn-primary">担当者を変更</button></form>`,root=>{root.querySelector('form').onsubmit=async e=>{e.preventDefault();if(await liveAction('communities/'+b.dataset.transferCommunity+'/transfer',{email:e.target.elements.email.value},e.target.querySelector('button'))){closeModal();render();}};}));
 const feed=scope.querySelector('[data-reports-feed]');if(feed)loadReports(feed);
 const offers=scope.querySelector('[data-offers-feed]');if(offers)loadOffers(offers);
 bindFormDrafts(scope);
}
async function loadReports(feed){const epoch=accountEpoch;try{const r=await accountAPI('live/reports');if(epoch!==accountEpoch||!feed.isConnected)return;reportRows=r.reports;feed.innerHTML=r.reports.map(r=>`<article class="card live-report-card"><h2>${escapeHtml(r.kind)}：${escapeHtml(r.communityName)}</h2><p>${escapeHtml(r.body)}</p><p>対応状況：${{OPEN:'受付済み',WORKING:'対応中',RESOLVED:'対応済み'}[r.status]}</p>${r.reply?`<p>運営から：${escapeHtml(r.reply)}</p>`:''}${current.view==='reports'?`<form data-report-response="${r.id}"><label>対応状況<select name="status">${Object.entries({OPEN:'受付済み',WORKING:'対応中',RESOLVED:'対応済み'}).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label>相談者への返信<textarea name="reply" maxlength="2000">${escapeHtml(r.reply)}</textarea></label><button class="btn btn-primary">対応を記録</button><a class="btn btn-ghost" href="/operator.html#/admin">団体の掲載状況を確認</a></form>`:''}</article>`).join('')||'<p>受け付けた相談はありません。</p>';feed.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();if(await liveAction('reports/'+f.dataset.reportResponse,Object.fromEntries(new FormData(f)),f.querySelector('button')))loadReports(feed);});}catch(e){if(feed.isConnected)feed.textContent=e.message;}}
async function loadOffers(feed){const epoch=accountEpoch;try{const r=await accountAPI('live/offers');if(epoch!==accountEpoch||!feed.isConnected)return;offerRows=r.offers;feed.innerHTML=r.offers.filter(o=>o.status!=='DECLINED').map(o=>`<article class="card live-report-card"><span class="badge badge-neutral">活動への招待</span><h2>${escapeHtml(o.communityName)}</h2>${o.available?`<h3>${escapeHtml(o.activity.title)}</h3><p>${escapeHtml(o.body)}</p><p class="hint">${escapeHtml(o.reason)}</p><a class="btn btn-primary" href="#/liveactivity/${encodeURIComponent(o.activity.id)}" data-offer-seen="${o.id}">内容を確認して参加を検討</a>`:'<p>募集の受付が終了したか、団体が非公開になっています。</p>'}<button class="btn btn-ghost" data-offer-decline="${o.id}">見送る</button></article>`).join('')||'<div class="card live-card"><p>届いているオファーはありません。プロフィールで興味や希望地域を登録し、受取りをオンにできます。</p><a href="#/mypage" class="btn btn-secondary">受取り設定へ</a></div>';feed.querySelectorAll('[data-offer-decline]').forEach(b=>b.onclick=async()=>{await accountAPI('live/offers/'+b.dataset.offerDecline,'POST',{status:'DECLINED'});loadOffers(feed);});feed.querySelectorAll('[data-offer-seen]').forEach(a=>a.onclick=()=>accountAPI('live/offers/'+a.dataset.offerSeen,'POST',{status:'SEEN'}).catch(()=>{}));}catch(e){if(feed.isConnected)feed.textContent=e.message;}}
function bindFormDrafts(scope){for(const form of scope.querySelectorAll('#liveCommunityForm,#liveActivityForm')){
 const key=(form.id==='liveCommunityForm'?'community-':'activity-')+(form.dataset.id||'new');
 const tools=document.createElement('div');tools.className='live-draft-tools';tools.innerHTML='<button type="button" class="btn btn-secondary btn-sm" data-draft-save>入力途中を保存</button> <button type="button" class="btn btn-ghost btn-sm" data-draft-load>保存した入力を復元</button><p class="hint" data-draft-status>文章・選択項目を自分専用の下書きに保存できます。写真は通常の保存時に登録してください。</p>';form.prepend(tools);
 const status=tools.querySelector('[data-draft-status]');tools.querySelector('[data-draft-save]').onclick=async()=>{const fields={};for(const el of form.elements){if(!el.name||el.type==='file')continue;if(el.type==='checkbox'){if(!fields[el.name])fields[el.name]=[];if(el.checked)fields[el.name].push(el.value);}else fields[el.name]=el.value;}try{await accountAPI('live/drafts/'+encodeURIComponent(key),'POST',{content:fields});status.textContent='入力途中を保存しました。';}catch(e){status.textContent=e.message;}};
 tools.querySelector('[data-draft-load]').onclick=async()=>{try{const {draft}=await accountAPI('live/drafts/'+encodeURIComponent(key));if(!draft){status.textContent='保存した入力はありません。';return;}const fields=JSON.parse(draft.content);for(const el of form.elements){if(!el.name||el.type==='file'||fields[el.name]===undefined)continue;if(el.type==='checkbox')el.checked=Array.isArray(fields[el.name])&&fields[el.name].includes(el.value);else el.value=fields[el.name];}form.dispatchEvent(new Event('draft-restored'));status.textContent='保存した入力を復元しました。内容を確認してから保存してください。';}catch(e){status.textContent=e.message;}};
}}


function officialSourceSettings(c){return `<section class="card live-card"><h2>公式サイトから情報を更新</h2><p>団体の公式ホームページから、お知らせの見出し・短い紹介文を自動で取り込みます。下の「写真・SNS」に公式ホームページを登録してください。</p><label class="account-consent"><input type="checkbox" name="officialUpdatesEnabled" ${c.officialUpdatesEnabled?'checked':''}><span>公式サイトの情報を1日1回、自動で取り込む</span></label>${liveField('feedURL','更新用URL（分かる場合のみ・RSS / Atom）',c.feedURL||'','url')}<p class="hint">サーバーの起動中に更新します。更新用データがなければページの見出しと紹介文を表示します。取り込んだ内容は「運営未確認」として団体ページに表示し、審査済みの紹介・参加条件・保険情報は上書きしません。情報元の設定変更も公開前の確認対象です。</p><details><summary>Instagramからの更新について</summary><p>公式Instagramへのリンクは「写真・SNS」で登録できます。投稿の自動取得は未連携です。団体のビジネス／クリエイターアカウントと、本人による連携許可が必要になります。</p></details></section>`;}
function officialSourcePanel(c,manage=false){if(!c)return '';return `<section class="card live-card official-source" data-source-panel="${escapeHtml(c.id)}" data-source-manage="${manage}"><h2>公式サイト・SNSの情報</h2><p class="hint">団体の本人確認と、公式サイト・SNSの投稿内容の確認は別のものです。</p><div data-source-content role="status">情報元を確認しています…</div></section>`;}
function officialSourceContent(u){
 const items=u.items||[];
 return `${u.enabled?`<div class="source-disclosure"><span class="badge badge-neutral">自動取得・運営未確認</span><p>${escapeHtml(u.disclaimer)}</p></div>${u.error?`<p class="source-warning">${escapeHtml(u.error)}${u.fetchedAt?' 以下は前回取得時の情報です。':''}</p>`:u.stale?'<p class="source-warning">取得から時間が経っています。情報元で最新の内容をご確認ください。</p>':''}${u.fetchedAt?`<p class="hint">取得日時：${escapeHtml(liveDate(u.fetchedAt))}（内容を確認した日時ではありません）</p>`:'<p>情報はまだ取得されていません。公式ページをご確認ください。</p>'}${u.mode==='page'?'<p class="hint">公式ページの抜粋です。記事の更新日時は取得できていません。</p>':''}${items.map(item=>`<article class="source-item"><h3>${escapeHtml(item.title)}</h3>${item.publishedAt?`<p class="hint">情報元の掲載日時：${escapeHtml(liveDate(item.publishedAt))}</p>`:''}<p>${escapeHtml(item.text||'')}</p><a class="btn btn-secondary btn-sm" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">情報元で内容を確認 ↗</a></article>`).join('')}${u.fetchedAt&&!items.length?'<p>配信されている記事はありません。</p>':''}`:'<p>ホームページの自動取得は設定されていません。最新情報は公式ページでご確認ください。</p>'}${u.sourceURL?`<p><a href="${escapeHtml(u.sourceURL)}" target="_blank" rel="noopener noreferrer">公式ホームページ・配信元 ↗</a></p>`:''}${u.instagram?.url?`<div class="source-instagram"><h3>公式Instagram</h3><p>投稿の自動取得は未連携です。投稿内容は運営で確認していません。最新情報はInstagramでご確認ください。</p><a class="btn btn-secondary btn-sm" href="${escapeHtml(u.instagram.url)}" target="_blank" rel="noopener noreferrer">Instagramを見る ↗</a></div>`:''}`;
}
function bindOfficialSources(scope){scope.querySelectorAll('[data-source-panel]').forEach(panel=>loadOfficialSourcePanel(panel));}
async function loadOfficialSourcePanel(panel){
 const body=panel.querySelector('[data-source-content]'),epoch=accountEpoch;
 try{const {updates}=await accountAPI('live/official-updates/'+encodeURIComponent(panel.dataset.sourcePanel));if(!panel.isConnected||epoch!==accountEpoch)return;
  body.innerHTML=officialSourceContent(updates);
  if(panel.dataset.sourceManage==='true'&&updates.enabled){const button=document.createElement('button');button.className='btn btn-ghost btn-sm';button.textContent='公式サイトから今すぐ取得';body.append(button);const status=document.createElement('p');status.setAttribute('role','status');body.append(status);button.onclick=async()=>{button.disabled=true;status.textContent='情報元から取得しています…';try{await accountAPI('live/official-updates/'+encodeURIComponent(panel.dataset.sourcePanel),'POST',{});if(panel.isConnected&&epoch===accountEpoch)await loadOfficialSourcePanel(panel);}catch(e){status.textContent=e.message;button.disabled=false;}};}
 }catch(e){if(panel.isConnected&&epoch===accountEpoch)body.textContent=e.message;}
}


/* Personal participation conditions; all checks and access control run on the server. */
function conditionProfileFields(p){const c=p.participation||{};return `<fieldset class="condition-settings"><legend>参加条件の変更をチェック</legend><p class="hint">申し込んだ活動の内容が変わったとき、登録した曜日・地域と、下の条件に合うか確認します。時間は日本時間です。</p><div class="live-form-grid"><label for="pf_budget">参加費の上限（円・任意）<input id="pf_budget" type="number" min="0" max="1000000" step="1" value="${escapeHtml(c.budget??'')}" placeholder="例：1000"></label><label for="pf_availableFrom">参加できる時刻から<input id="pf_availableFrom" type="time" value="${escapeHtml(c.from||'')}"></label><label for="pf_availableUntil">参加できる時刻まで<input id="pf_availableUntil" type="time" value="${escapeHtml(c.until||'')}"></label></div><p class="hint">0円は無料のみ。空欄は条件未設定です。時間帯は同じ日の範囲で指定します。交通費・実際の移動時間は判定に含みません。予算や時間帯は一般公開されません。</p></fieldset>`;}
function readConditionProfile(){if(!document.getElementById('pf_budget'))return {...(DB.profile.participation||{})};const from=document.getElementById('pf_availableFrom').value,until=document.getElementById('pf_availableUntil').value,budget=document.getElementById('pf_budget').value;if(!!from!==!!until||(from&&from>=until)){toast('時間帯は開始・終了を両方入力し、終了を開始より後にしてください');return false;}return {budget:budget===''?null:Number(budget),from,until};}
function conditionActivityFields(a){return `<fieldset class="condition-settings"><legend>参加条件の確認に使う情報</legend><div class="live-form-grid"><label>参加費の金額（円）<input name="feeAmount" type="number" min="0" max="1000000" step="1" value="${escapeHtml(a.feeAmount??'')}" placeholder="無料なら0"></label><label>会場の市町村<select name="activityCity"><option value="">未確認・未登録</option>${GUNMA_MUNICIPALITIES.map(city=>`<option value="${escapeHtml(city)}" ${a.activityCity===city?'selected':''}>${escapeHtml(city)}</option>`).join('')}</select></label></div><p class="hint">空欄を無料や参加可能とは判定しません。費用の補足と金額が一致しているか確認してください。正確な集合場所は承認後に表示します。</p></fieldset>`;}
function conditionValue(key,value){if(value===null||value===undefined||value===''||(Array.isArray(value)&&!value.length))return '未登録';if(['startsAt','endsAt'].includes(key))return new Date(value).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});if(key==='feeAmount')return Number(value).toLocaleString('ja-JP')+'円';if(key==='highSchoolParticipation')return HIGH_SCHOOL_LABELS[value]||value;if(key==='activityKind')return COMMUNITY_ACTIVITY_TYPES[value]||value;if(key==='participationScope')return {unknown:'確認中・参加条件に記載',open:'団体に入っていなくても参加できる',members:'所属メンバーのみ'}[value]||value;return Array.isArray(value)?value.join('・'):String(value);}
function conditionDiffHTML(rows){return `<div class="condition-differences">${rows.map(r=>`<div class="condition-difference"><b>${escapeHtml(r.label)}</b><div><small>変更前</small><p>${escapeHtml(conditionValue(r.key,r.before))}</p></div><div><small>変更後</small><p>${escapeHtml(conditionValue(r.key,r.after))}</p></div></div>`).join('')||'<p>活動名・募集人数などが変更されました。最新の案内を確認してください。</p>'}</div>`;}
function conditionReceiptHTML(p){const c=p.conditionChange;if(!c)return '';const pending=c.pending?'<p class="condition-pending" role="status">活動の変更案を運営が確認中です。確定後にお知らせします。現在の案内は変更前の内容です。</p>':'';if(!c.changeId)return pending;
 if(p.owned)return pending+`<p class="hint">変更内容の確認：${c.ackAt?'参加者が確認済み':'参加者の確認待ち'}</p>`;
 const actionable=['APPLIED','APPROVED'].includes(p.status);

function serendipityPickHTML(p){if(!p)return '';if(!p.activity)return '<div class="card live-card"><p>前回紹介した活動は、受付終了・申込み済み・非公開などにより、現在は紹介対象ではありません。</p></div>';

 const minutes=Math.round((new Date(a.endsAt)-new Date(a.startsAt))/60000),duration=Number.isFinite(minutes)&&minutes>0?(minutes>=60?Math.floor(minutes/60)+'時間'+(minutes%60?minutes%60+'分':''):minutes+'分'):'詳細で確認';
 const facts=`<dl class="serendipity-mini-facts"><div><dt>参加費</dt><dd>${a.feeAmount===0?'無料':Number.isFinite(a.feeAmount)?a.feeAmount.toLocaleString()+'円':'詳細で確認'}</dd></div><div><dt>活動時間</dt><dd>${duration}</dd></div><div><dt>活動エリア</dt><dd>${escapeHtml(a.activityCity||'詳細で確認')}</dd></div></dl>`;

 <div class="serendipity-reaction"><p><b>この活動、前から知っていた？</b><span class="hint"> 自分だけの発見ノートに残せます。</span></p><div class="live-navigation">${[['new','初めて知った！'],['known','知っていた']].map(([value,label])=>`<button class="btn btn-ghost" data-serendipity-awareness="${value}" data-pick="${escapeHtml(p.id)}" aria-pressed="${p.awareness===value}">${p.awareness===value?'✓ ':''}${label}</button>`).join('')}</div></div>
 <div class="live-navigation"><a class="btn btn-primary" href="#/liveactivity/${encodeURIComponent(a.id)}">どんなことをするの？</a><button class="btn btn-secondary" data-serendipity-feedback="interested" data-pick="${escapeHtml(p.id)}" aria-pressed="${p.feedback==='interested'}">${p.feedback==='interested'?'✓ 気になるに保存済み':'やってみたいかも！'}</button><button class="btn btn-ghost" data-serendipity-feedback="pass" data-pick="${escapeHtml(p.id)}" aria-pressed="${p.feedback==='pass'}">${p.feedback==='pass'?'今回は見送りました':'今回は見送る'}</button></div>${p.awareness==='new'&&p.feedback==='interested'?'<p class="serendipity-spark" role="status">✦ 「知らなかった」が「気になる」に変わった！ 発見ノートに残しました。</p>':''}<p class="hint">気が向いたときに参加すれば大丈夫。保存や見送りは本人だけに表示し、申込み・フォローは行いません。</p></article>`;
}
function serendipityNotebookHTML(d){
 const history=d?.history||[],s=d?.stats||{},interested=history.filter(p=>p.feedback==='interested'),fresh=history.filter(p=>p.awareness==='new');
 const rows=serendipityNotebookFilter==='interested'?interested:serendipityNotebookFilter==='new'?fresh:history;

 return `<section class="serendipity-history" id="discoveryNotebook"><h2>わたしの発見ノート</h2><p>知らなかった世界を、一つずつ。気になった活動は、あとからゆっくり見返せます。</p><div class="serendipity-notebook-stats"><span><b>${s.genres||0}</b> 分野に出会った</span><span><b>${s.sparks||0}</b> 件の「知らなかった → 気になる」</span></div>${genres.length?`<div class="discovery-stamps" aria-label="最近出会った分野">${genres.map((g,i)=>`<span class="discovery-stamp ${history.some(p=>p.genre===g&&p.awareness==='new'&&p.feedback==='interested')?'new-spark':''}"><span aria-hidden="true">${symbols[i%symbols.length]}</span><span>${escapeHtml(g)}</span></span>`).join('')}</div>`:'<div class="discovery-empty-note"><b>最初の発見は、どんな世界だろう。</b><p>扉を開くと、ここに活動の記録が増えていきます。</p></div>'}${history.length?`<div class="discovery-notebook-tabs" role="group" aria-label="発見ノートの絞り込み">${[['all','すべて',history.length],['interested','気になる',interested.length],['new','初めて知った',fresh.length]].map(([key,label,count])=>`<button type="button" class="btn btn-ghost btn-sm" data-notebook-filter="${key}" aria-pressed="${serendipityNotebookFilter===key}">${label}（${count}）</button>`).join('')}</div>${rows.map(p=>`<div class="serendipity-history-row"><div><b>${escapeHtml(p.activity?.title||'現在は紹介対象外の活動')}</b><p>${escapeHtml(p.genre)} ／ ${escapeHtml(liveDate(p.createdAt))}</p><small>${p.awareness==='new'?'初めて知った':p.awareness==='known'?'知っていた':'まだ回答していません'} · ${p.feedback==='interested'?'気になるに保存':p.feedback==='pass'?'今回は見送り':'感想はいつでも残せます'}</small></div>${p.activity?`<a href="#/liveactivity/${encodeURIComponent(p.activity.id)}">詳細を見る →</a>`:'<span class="hint">現在は公開されていません</span>'}</div>`).join('')||'<p class="discovery-empty-note">この記録はまだありません。気になる活動が見つかったら、残してみよう。</p>'}<p class="hint">一覧と分野のスタンプは最近20件から表示。集計はこれまでの記録です。記録は自分だけに表示し、ポイントや順位には使いません。</p>`:''}</section>`;
}

function viewSerendipity(){
 if(current.view!=='serendipity')return null;
 if(!ACCOUNT_SERVER)return liveShell('よりみち発見','<a href="http://localhost:4177/#/serendipity">アプリを起動して開く</a>');
 if(!accountUser)return viewAccount('login');
 if(SERENDIPITY.uid!==accountUser.id)clearSerendipity();
 const d=SERENDIPITY.data;
 return liveShell('よりみち発見',`<p class="discovery-lead">検索しようとも思わなかったことが、面白いかもしれない。</p><p class="serendipity-error" role="alert">${escapeHtml(SERENDIPITY.error)}</p>${!SERENDIPITY.loaded?'<p role="status">あなたの参加条件を確認しています…</p>':d?.needs?.length?`<section class="card live-card"><h2>まず、選ぶための条件を教えてください</h2><p>マイページで「${d.needs.map(escapeHtml).join('」「')}」を登録すると、興味の外の活動を紹介できます。</p><a class="btn btn-primary" href="#/mypage">マイページで登録する</a></section>`:d?`${serendipityDoorHTML(d)}<div class="serendipity-controls"><button class="btn btn-ghost" data-serendipity-refresh>最新の条件で確認</button><a class="btn btn-ghost" href="#/mypage">参加条件を見直す</a></div>${!d.candidateActivities?'<div class="card live-card"><h2>今は、新しく紹介できる活動がありません</h2><p>条件に合う募集がないか、候補をすべて紹介しました。参加条件を緩めることはしません。新しい募集が届いたら、また確かめてみてください。</p><a class="btn btn-secondary" href="#/list">活動一覧から探す</a></div>':''}${serendipityPickHTML(d.current)}`:'<button class="btn btn-secondary" data-serendipity-refresh>もう一度読み込む</button>'}
 <details class="serendipity-policy"><summary>どう選んでいるの？</summary><p>運営確認済みの公開募集から、初参加歓迎・申込期限内・定員に空きがある活動を探します。登録した興味、参加完了記録、「よりみち発見」で気になると保存した分野は候補から外します。保存した分野ばかりを紹介し続けません。</p><p>申込み済み・ブロック中・変更確認中は除きます。曜日・希望地域を確認し、予算・時間帯・移動手段を登録している場合はその条件も照合します。必要な情報が不明なら紹介しません。予算・時間帯が未登録なら、その項目は未登録と表示します。</p><p>同じ活動は30日間繰り返しません。候補の団体を同じ確率で選び、次にその団体の活動を選びます。人数・口コミ・課金額は使いません。外部AIには接続せず、このルールで選んでいます。</p><p>興味の分類とアプリ内の記録を目安に選びます。アプリ外の体験や、本当に知っているかどうかは判断できません。確認済みや条件一致という表示は、安全性の保証ではありません。</p></details>${serendipityNotebookHTML(d)}`);
}
async function loadSerendipity(path='',body,button){
 const uid=accountUser?.id,epoch=accountEpoch;if(!uid||SERENDIPITY.loading)return;
 const request=++SERENDIPITY.request;SERENDIPITY.uid=uid;SERENDIPITY.loading=true;SERENDIPITY.reveal=false;if(button)button.disabled=true;
 const opening=path==='/pick';if(opening){button?.classList.add('is-opening');button?.setAttribute('aria-busy','true');}
 try{const [data]=await Promise.all([accountAPI('live/serendipity'+path,body===undefined?'GET':'POST',body),opening&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches?new Promise(r=>setTimeout(r,550)):Promise.resolve()]);if(epoch!==accountEpoch||uid!==accountUser?.id||request!==SERENDIPITY.request)return;SERENDIPITY={uid,loaded:true,loading:false,data,error:'',request,reveal:opening&&!data.noCandidate};}
 catch(e){if(epoch!==accountEpoch||uid!==accountUser?.id||request!==SERENDIPITY.request)return;SERENDIPITY.loading=false;SERENDIPITY.loaded=true;SERENDIPITY.error=e.message;}
 if(current.view==='serendipity'){render();if(SERENDIPITY.reveal){const card=document.querySelector('.serendipity-pick');card?.focus({preventScroll:true});card?.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}}
}
function bindSerendipityUI(scope){
 if(current.view!=='serendipity'||!accountUser)return;
 if(!SERENDIPITY.loaded&&!SERENDIPITY.loading){loadSerendipity();return;}
 scope.querySelectorAll('[data-notebook-filter]').forEach(b=>b.onclick=()=>{serendipityNotebookFilter=b.dataset.notebookFilter;const section=scope.querySelector('.serendipity-history');if(section){section.outerHTML=serendipityNotebookHTML(SERENDIPITY.data);bindSerendipityUI(scope);scope.querySelector('[data-notebook-filter="'+serendipityNotebookFilter+'"]')?.focus({preventScroll:true});}});
 scope.querySelector('[data-serendipity-pick]')&&(scope.querySelector('[data-serendipity-pick]').onclick=e=>loadSerendipity('/pick',{},e.currentTarget));
 scope.querySelector('[data-serendipity-refresh]')&&(scope.querySelector('[data-serendipity-refresh]').onclick=e=>loadSerendipity('',undefined,e.currentTarget));
 scope.querySelectorAll('[data-serendipity-feedback]').forEach(b=>b.onclick=()=>loadSerendipity('/'+b.dataset.pick+'/feedback',{feedback:b.dataset.serendipityFeedback},b));
 scope.querySelectorAll('[data-serendipity-awareness]').forEach(b=>b.onclick=()=>loadSerendipity('/'+b.dataset.pick+'/awareness',{awareness:b.dataset.serendipityAwareness},b));
}


let dailyVisitRequest=null,dailyVisitUser='',dailyVisitNextCheck=0,dailyVisitError='',dailyVisitNotice='';
function showDailyVisitNotice(result){const key=accountUser?.id+':'+result?.dailyVisit?.day;if(result?.dailyVisit?.awarded&&key!==dailyVisitNotice){dailyVisitNotice=key;toast('今日のよりみちで +1pt！');}}
async function recordDailyVisit(announce=true){
 if(!ACCOUNT_SERVER||OPERATOR_APP||!accountReady||!accountUser||document.visibilityState==='hidden')return null;
 const uid=accountUser.id,epoch=accountEpoch;
 if(dailyVisitUser!==uid){dailyVisitUser=uid;dailyVisitNextCheck=0;dailyVisitRequest=null;dailyVisitError='';}
 if(dailyVisitRequest)return dailyVisitRequest;
 if(performance.now()<dailyVisitNextCheck)return null;
 const request=(async()=>{try{
  const started=performance.now(),result=await accountAPI('live/daily-visit','POST',{});
  if(accountUser?.id!==uid||accountEpoch!==epoch)return null;
  dailyVisitNextCheck=started+Math.max(0,result.dailyVisit.nextCheckInMs);dailyVisitError='';
  if(LIVE.dashboard){Object.assign(LIVE.dashboard,result);updateDailyVisitDisplay();}
  if(announce)showDailyVisitNotice(result);
  return result;
 }catch(e){if(accountUser?.id===uid&&accountEpoch===epoch){dailyVisitNextCheck=performance.now()+3000;dailyVisitError='訪問ポイントを確認できませんでした。通信を確認して再読み込みしてください。';updateDailyVisitDisplay();}return null;}
 })();

function bindCommunityWizard(form){
 if(!form||form.dataset.guided||form.querySelector('.live-registration-required'))return;form.dataset.guided='true';form.noValidate=true;
 const originals=[...form.children],titles=['基本情報','活動・参加条件','写真・公式リンク','確認・保存'];
 const base=originals.find(n=>n.querySelector('[name="name"]'));
 const intro=form.querySelector('[name="intro"]')?.closest('.field');if(base&&intro)base.append(intro);
 const panels=titles.map((title,i)=>{const node=document.createElement('section');node.className='community-wizard-panel';node.dataset.step=String(i);node.id='community-step-'+i;form.append(node);return node;});
 for(const node of originals){
  if(node.classList.contains('live-draft-tools'))continue;
  const i=node===base?0:node.classList.contains('live-register-submit')||node.classList.contains('live-admin-private')?3:node.querySelector('[name="officialUpdatesEnabled"]')||node.querySelector('input[type="file"]')?2:1;

 }

 const progress=document.createElement('p');progress.className='hint community-wizard-progress';progress.setAttribute('role','status');nav.after(progress);
 const summary=document.createElement('section');summary.className='card live-card community-save-summary';panels[3].prepend(summary);
 const footer=document.createElement('div');footer.className='community-wizard-footer';footer.innerHTML='<button type="button" class="btn btn-ghost" data-step-back>前へ</button><span data-step-label></span><button type="button" class="btn btn-primary" data-step-next>次へ</button>';form.append(footer);
 let step=0;
 function update(){
  const count=['name','type','city','intro'].filter(k=>form.elements[k]?.value.trim()).length;progress.textContent=`必須項目 ${count}/4 入力済み。途中でも保存できます。`;
  summary.innerHTML=`<h2>保存する内容を確認</h2><dl>${[['name','団体名'],['type','種類'],['city','地域'],['intro','紹介文']].map(([k,l])=>`<div><dt>${l}</dt><dd>${escapeHtml(form.elements[k]?.value||'未入力')}</dd></div>`).join('')}</dl><p class="hint">保存後も確認が終わるまで公開されません。連絡先・確認メモは運営だけに表示します。</p>`;
 }
 function show(n,focus=true){step=Math.max(0,Math.min(3,n));panels.forEach((p,i)=>p.hidden=i!==step);nav.querySelectorAll('button').forEach((b,i)=>{if(i===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});footer.querySelector('[data-step-back]').disabled=step===0;footer.querySelector('[data-step-next]').hidden=step===3;footer.querySelector('[data-step-label]').textContent=`${step+1} / 4`;update();if(focus){const target=panels[step].querySelector('h2');if(target){target.tabIndex=-1;target.focus({preventScroll:true});}nav.scrollIntoView({block:'start',behavior:'instant'});}}
 function invalid(root){return [...root.querySelectorAll('input,select,textarea')].find(el=>!el.checkValidity());}
 function report(el){const p=el.closest('.community-wizard-panel');if(p)show(Number(p.dataset.step));let parent=el.parentElement;while(parent&&parent!==form){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}el.reportValidity();el.focus();}
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(Number(b.dataset.stepGo)));
 footer.querySelector('[data-step-back]').onclick=()=>show(step-1);

 const save=form.onsubmit;form.onsubmit=async e=>{e.preventDefault();const el=invalid(form);if(el){report(el);return;}if(step!==3){show(3);return;}return save?.(e);};show(0,false);

function communityGenreKey(value){const s=communityGenreNormal(value);if(!s)return null;return COMMUNITY_GENRES.find(g=>[g.id,g.label,...g.interests,...g.aliases].some(v=>communityGenreNormal(v)===s))?.id||null;}

function communityInterestChoices(){return [...COMMUNITY_GENRES].sort((a,b)=>a.reading.localeCompare(b.reading,'ja')).map(g=>[g.id,g]);}
function communityInterestSelected(ids,key){return (ids||[]).some(v=>communityGenreKey(v)===key);}
function preserveCommunityGenres(previous,selected){const output=[];for(const label of selected){const key=communityGenreKey(label),old=previous.filter(v=>key&&communityGenreKey(v)===key);output.push(...(old.length?old:[label]));}return [...new Set(output)];}

const LEVELS = [
  {min:0, name:'とびらのカギ', color:'#7E8F82'},
  {min:10, name:'よりみち探検家', color:'#1F7A52'},
  {min:40, name:'発見コレクター', color:'#155C3E'},

// With the account server, achievements follow the real participation records (LIVE.dashboard);
// the sample-data counters are only used for the offline file version.
// Count distinct normalized genres (aliases of one genre count once) against the real genre list.
const liveAchievementGenres=()=>new Set((LIVE.dashboard?.participationGenres||[]).map(communityGenreKey).filter(Boolean)).size;
const ACHIEVEMENTS = [
  {id:'first_apply', label:'地域デビュー',   desc:'はじめて活動に申込みをした', points:5,  test:()=>ACCOUNT_SERVER?liveOwnApplications().length>=1:DB.applications.length>=1},
  {id:'first_done',  label:'はつたいけん',   desc:'活動を1つ完了した',         points:15, test:()=>ACCOUNT_SERVER?liveOwnApplications().some(p=>p.status==='DONE'):DB.applications.some(a=>a.status==='done')},
  {id:'genre3',      label:'ジャンル探検家', desc:'3つのジャンルの活動に参加した', points:25, test:()=>ACCOUNT_SERVER?liveAchievementGenres()>=3:(DB.badges||[]).length>=3},
  {id:'genreAll',    label:'ぐんまマスター', desc:'すべてのジャンルの活動に参加した', points:50, test:()=>ACCOUNT_SERVER?liveAchievementGenres()>=COMMUNITY_GENRES.length:(DB.badges||[]).length>=Object.keys(GENRES).length},
];
function levelFor(points){ let lvl = LEVELS[0]; for(const l of LEVELS){ if(points>=l.min) lvl = l; } return lvl; }
function nextLevelFor(points){ return LEVELS.find(l=>l.min>points) || null; }
function levelProgressPct(points){
  const cur = levelFor(points), next = nextLevelFor(points);
  if(!next) return 100;
  return Math.max(4, Math.min(100, Math.round(((points-cur.min)/(next.min-cur.min))*100)));
}

  const before = levelFor(DB.points||0);

  const after = levelFor(DB.points);

const TRUST_CRITERIA = [

  {key:'followUp',         label:'活動後のお礼やフォロー'},
  {key:'safetyUpdate',     label:'安全確認と保険情報の更新'},

function getTrustChecklist(communityId){
  DB.trustChecklist = DB.trustChecklist||{};
  if(!DB.trustChecklist[communityId]){
    const c = communityById(communityId);
    DB.trustChecklist[communityId] = Object.assign({}, c && c.trustChecklist);
  }
  return DB.trustChecklist[communityId];
}
function trustTier(checklist){
  const met = TRUST_CRITERIA.filter(t=>checklist[t.key]).length;
  if(met>=6) return {stage:2, label:'両目だるま・信頼認定パートナー', short:'両目だるま', met};
  if(met>=3) return {stage:1, label:'片目だるま・信頼スタート',       short:'片目だるま', met};

let current = {view:'home', param:null};

function nav(view, param){
  const target=surfaceTarget(view,param);
  if(target.cross){location.assign(target.url);return;}
  view=target.view;
  current = {view, param};
  const newHash = '#/' + view + (param ? '/' + param : '');
  if(location.hash === newHash){ render(); } else { location.hash = newHash; }
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const [view, param] = h.split('/');
  current = {view: view || (OPERATOR_APP?'manage':'home'), param: param || null};
}
let routeRefreshVersion=0;
window.addEventListener('hashchange', async ()=>{
  parseHash();
  const version=++routeRefreshVersion;
  if(current.view==='serendipity')clearSerendipity();
  // Fetch current participation records on explicit navigation, without background redraws while typing.
  if(ACCOUNT_SERVER&&accountReady&&accountUser&&['home','mypage','myactivity','notifications','saved','following'].includes(current.view))await refreshLive(false);
  if(version===routeRefreshVersion)render();
});

/* ---------------- Toast ---------------- */
let toastQueue = [];
let toastBusy = false;
function toast(msg, variant){
  toastQueue.push({msg, variant});
  processToastQueue();
}
function processToastQueue(){
  if(toastBusy || !toastQueue.length) return;
  toastBusy = true;
  const {msg, variant} = toastQueue.shift();
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (variant==='reward' ? ' toast-reward' : '');
  el.textContent = msg;
  root.innerHTML='';
  root.appendChild(el);
  setTimeout(()=>{
    if(root.contains(el)) root.removeChild(el);
    toastBusy = false;
    processToastQueue();
  }, 2000);
}

/* ---------------- Modal ---------------- */
function openModal(html, onMount){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" data-close-overlay><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector('[data-close-overlay]').addEventListener('click', (e)=>{ if(e.target.hasAttribute('data-close-overlay')) closeModal(); });
  root.querySelectorAll('[data-modal-close]').forEach(b=>b.addEventListener('click', closeModal));
  root.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>nav(b.dataset.nav)));
  if(onMount) onMount(root);
}

function getMessages(applicationId){

function sendMessage(applicationId, from, text){

  DB.messages = DB.messages||[];

function openMessageThread(applicationId, viewerRole){
  const app = DB.applications.find(x=>x.id===applicationId);
  if(!app) return;
  const a = activityById(app.activityId);
  const c = communityById(a.communityId);
  const studentLabel = app.name || '学生';
  openModal(`

  `, (root)=>{
    const list = root.querySelector('#msgThreadList');
    function renderList(){
      const msgs = getMessages(applicationId);
      if(!msgs.length){
        list.innerHTML = `<p class="faint" style="text-align:center;padding:16px 0;">まだメッセージはありません。最初のメッセージを送ってみましょう。</p>`;
      } else {
        list.innerHTML = msgs.map(m=>{
          const mine = m.from===viewerRole;
          const senderLabel = m.from==='org' ? c.name : studentLabel;
          return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:82%;">

      input.value='';
      renderList();
    }
    renderList();
    root.querySelector('#msgSend').addEventListener('click', send);
    root.querySelector('#msgInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
  });
}

  return [...Object.entries(GENRES).map(([id,g])=>({id,label:g.label,reading:readings[id]})),...EXTRA_INTERESTS].sort((a,b)=>a.reading.localeCompare(b.reading,'ja')).map(v=>[v.id,v]);
}
function relatedInterests(activity, ids){
  const text=normalizeKeyword([activity.title,activity.purpose,activity.tasks].join(' '));
  return EXTRA_INTERESTS.filter(i=>(ids||[]).includes(i.id)&&i.keywords.some(w=>text.includes(normalizeKeyword(w))));
}
function recommendActivities(limit){
  const p = DB.profile;
  const appliedIds = new Set(DB.applications.map(x=>x.activityId));
  const scored = ACTIVITIES.filter(a=>!appliedIds.has(a.id)).map(a=>{
    let score = 0; const reasons = [];
    if(p.interests && p.interests.includes(a.genre)){ score += 3; reasons.push(`興味のある「${GENRES[a.genre].label}」`); }
    const related=relatedInterests(a,p.interests);
    if(related.length){score+=3;reasons.push('興味のある「'+related.map(i=>i.label).join('・')+'」に関連する活動');}
    if(p.areas && p.areas.includes(a.city)){ score += 2; reasons.push(`希望エリアの${a.city}`); }
    if(p.days && p.days.some(d=>a.dateLabel.includes(d))){ score += 1; reasons.push('参加できる曜日に開催'); }
    if(p.transport && p.transport.some(t=>a.transport.includes(t))){ score += 1; reasons.push('登録した移動手段で行ける'); }
    if(a.urgent) score += 0.5;
    return {a, score, reasons};
  }).filter(x=>x.score>0).sort((x,y)=>y.score-x.score);
  return scored.slice(0, limit||3);
}

}

function activityReviews(id){return (DB.reviews||[]).filter(r=>r.activityId===id);}
function communityReviews(id){return (DB.reviews||[]).filter(r=>activityById(r.activityId)?.communityId===id);}
function canReview(id){return (DB.applications||[]).some(a=>a.activityId===id&&a.status==='done');}
function ownReview(id){return activityReviews(id).find(r=>r.owner==='local-profile');}
function persistReview(id,input){
 if(!activityById(id)||!canReview(id))throw Error('参加完了済みの活動に投稿できます。');
 const text=String(input.text||'').trim(),rating=Number(input.rating);
 if(!Number.isInteger(rating)||rating<1||rating>5)throw Error('満足度を選んでください。');
 if(text.length<10||text.length>1000)throw Error('感想は10〜1,000文字で入力してください。');
 const previous=DB.reviews||[],existing=ownReview(id),now=new Date().toISOString();
 const review={id:existing?.id||'review-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),owner:'local-profile',activityId:id,rating,text,author:input.anonymous?'匿名の参加者':String(DB.profile.nickname||'参加者').slice(0,40),anonymous:!!input.anonymous,createdAt:existing?.createdAt||now,updatedAt:now};
 DB.reviews=[review,...previous.filter(r=>r.id!==existing?.id)];
 if(!save()){DB.reviews=previous;throw Error('保存できませんでした。ブラウザの保存容量をご確認ください。');}
 return review;
}
function removeOwnReview(id){const r=ownReview(id);if(!r)return;const previous=DB.reviews;DB.reviews=previous.filter(x=>x.id!==r.id);if(!save()){DB.reviews=previous;throw Error('削除内容を保存できませんでした。');}}
function reviewCardsHTML(reviews,showActivity=false){return reviews.length?reviews.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(r=>`<article class="review-card"><div class="review-card-head"><strong>${campusEscape(r.author)}</strong><span aria-label="満足度5点中${r.rating}点" class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div>${showActivity?`<p><button class="btn btn-ghost btn-sm" data-open-detail="${r.activityId}">${campusEscape(activityById(r.activityId)?.title||'活動')}</button></p>`:''}<p class="review-copy">${campusEscape(r.text)}</p><div class="review-card-head"><small class="faint">${campusEscape(r.createdAt.slice(0,10))}${r.updatedAt!==r.createdAt?'・編集済み':''} ／ 自分のサンプル投稿</small><div><button class="btn btn-ghost btn-sm" data-review-edit="${r.activityId}">編集</button><button class="btn btn-ghost btn-sm" data-review-delete="${r.activityId}">削除</button></div></div></article>`).join(''):'<p class="faint">まだ口コミはありません。参加した感想を聞かせてください。</p>';}
function reviewsHTML(id,community=false){const rows=community?communityReviews(id):activityReviews(id),existing=ownReview(id);return `<section class="detail-block reviews-section" aria-label="参加者の口コミ"><div class="review-card-head"><h3>参加者の口コミ <span class="badge badge-neutral">${rows.length}件</span></h3>${!community?`<button class="btn btn-secondary btn-sm" data-review-edit="${id}">${existing?'口コミを編集する':'口コミを書く'}</button>`:''}</div><p class="faint">参加完了済みの活動に1件ずつ投稿できます。満足度は体験の感想で、安全性の評価ではありません。</p>${reviewCardsHTML(rows,community)}<p class="faint">サンプルの口コミです。自分のアカウントに保存され、他の利用者には配信されません。実際の参加人数・口コミ件数・にぎわいポイントには含みません。</p></section>`;}

 root.querySelector('#reviewForm').onsubmit=e=>{e.preventDefault();try{persistReview(id,{rating:root.querySelector('#reviewRating').value,text:field.value,anonymous:root.querySelector('#reviewAnonymous').checked});closeModal();render();toast(r?'サンプルの口コミを更新しました':'サンプルの口コミを保存しました。実際の集計には含みません。');}catch(error){root.querySelector('#reviewError').textContent=error.message;}};

let mapFilters = {city:'all', genre:'all', beginner:false, freq:'all', urgent:false, university:'all', keyword:'', year:''};

  return GUNMA_UNIVERSITIES.filter(u=>COMMUNITIES.some(c=>c.studentLed && c.university===u));

function normalizeKeyword(value){ return String(value||'').normalize('NFKC').toLocaleLowerCase('ja').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function matchesKeyword(a, keyword){
  const c=communityById(a.communityId)||{};
  const text=normalizeKeyword([a.title,a.city,a.area,a.purpose,a.tasks,a.requirements,a.transport,GENRES[a.genre]?.label,c.name,c.university,c.intro].filter(Boolean).join(' '));
  return normalizeKeyword(keyword).trim().split(/\s+/).filter(Boolean).every(word=>text.includes(word));
}
function filteredActivities(){
  return ACTIVITIES.filter(a=>{
    if(!matchesKeyword(a,mapFilters.keyword) || !acceptsYear(a,mapFilters.year)) return false;
    if(mapFilters.city!=='all' && a.city!==mapFilters.city) return false;
    if(mapFilters.genre!=='all' && a.genre!==mapFilters.genre) return false;
    if(mapFilters.beginner && !a.beginner) return false;
    if(mapFilters.urgent && !a.urgent) return false;
    if(mapFilters.freq!=='all' && a.frequency!==mapFilters.freq) return false;
    if(mapFilters.university!=='all'){
      const c = communityById(a.communityId);
      if(!c || c.university!==mapFilters.university) return false;
    }
    return true;
  });
}

function bindFilterBar(idPrefix, onChange){
  const years=document.getElementById(idPrefix+'year'); years.value=mapFilters.year;
  years.addEventListener('change',()=>{mapFilters.year=years.value;mapFilters.keyword=document.getElementById(idPrefix+'keyword').value.trim();selectedPin=null;onChange();});
  const input=document.getElementById(idPrefix+'keyword');
  input.value=mapFilters.keyword||'';
  document.getElementById(idPrefix+'searchForm').addEventListener('submit',e=>{
    e.preventDefault(); mapFilters.keyword=input.value.trim(); selectedPin=null; onChange();
    document.getElementById(idPrefix+'keyword')?.focus();
  });
  document.getElementById(idPrefix+'clearKeyword').addEventListener('click',()=>{
    mapFilters.keyword=''; selectedPin=null; onChange(); document.getElementById(idPrefix+'keyword')?.focus();
  });
  document.getElementById(idPrefix+'city').value = mapFilters.city;
  document.getElementById(idPrefix+'genre').value = mapFilters.genre;
  document.getElementById(idPrefix+'freq').value = mapFilters.freq;
  document.getElementById(idPrefix+'university').value = mapFilters.university;
  const chip = document.getElementById(idPrefix+'beginnerChip');
  if(mapFilters.beginner) chip.classList.add('on');
  const uChip = document.getElementById(idPrefix+'urgentChip');
  if(mapFilters.urgent) uChip.classList.add('on');
  uChip.addEventListener('click', (e)=>{ e.preventDefault(); mapFilters.urgent = !mapFilters.urgent; onChange(); });
  document.querySelectorAll(`#${idPrefix}city,#${idPrefix}genre,#${idPrefix}freq,#${idPrefix}university`).forEach(sel=>{
    sel.addEventListener('change', ()=>{ mapFilters[sel.dataset.filter]=sel.value; onChange(); });
  });
  chip.addEventListener('click', (e)=>{ e.preventDefault(); mapFilters.beginner = !mapFilters.beginner; onChange(); });
}

// Public sample municipality reference points, never private meeting locations.
const PUBLIC_MAP_POINTS={'前橋市':[36.39,139.06],'高崎市':[36.32,139.00],'桐生市':[36.40,139.33],'太田市':[36.29,139.38]};
let circleSearch=null,activeCircleMap=null,circleMapView=null;
function distanceInMeters(a,b){const rad=Math.PI/180,dlat=(b[0]-a[0])*rad,dlon=(b[1]-a[1])*rad;const h=Math.sin(dlat/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dlon/2)**2;return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(Math.max(0,1-h)));}
function activitiesInCircle(list,circle=circleSearch){if(!circle)return list;return list.filter(a=>{const point=PUBLIC_MAP_POINTS[a.city];return point&&distanceInMeters(circle.center,point)<=circle.radius;});}
function mapResultHTML(){const list=activitiesInCircle(filteredActivities());return `<h3 style="margin:20px 0 14px" role="status">${circleSearch?'円の範囲内':'この条件'}の活動 ${list.length}件</h3><div class="act-grid">${list.length?list.map(actCardHTML).join(''):'<div class="empty-state"><p>この範囲・条件に合う活動はありません。円を広げるか、絞り込み条件を変更してください。</p></div>'}</div>`;}
function viewMap(){
 const place=mapFilters.city==='all'?'群馬県':'群馬県 '+mapFilters.city;
 return `<div class="container section"><div class="section-head"><div><div class="eyebrow">Community Map</div><h2>地図を囲んで活動を探す</h2><p>好きな場所を円で囲むと、その範囲の活動に絞り込めます。</p></div></div>${filterBarHTML('m_')}<div class="circle-map-tools"><button class="btn btn-primary" id="drawMapCircle" aria-pressed="false">円で囲んで探す</button><button class="btn btn-secondary" id="circleMapCenter">画面の中央を囲む</button><button class="btn btn-ghost" id="clearMapCircle" ${circleSearch?'':'disabled'}>範囲を解除</button><a class="btn btn-ghost" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(place)}" target="_blank" rel="noopener noreferrer">Googleマップで開く ↗</a></div><p id="circleMapHint" class="hint" role="status">「円で囲んで探す」を押して、中心から外側へドラッグ。タップだけなら半径5kmの円を作れます。</p><div class="circle-radius"><label for="circleRadius">円の半径 <output id="circleRadiusLabel">${circleSearch?(circleSearch.radius/1000).toFixed(1)+'km':'未指定'}</output></label><input id="circleRadius" type="range" min="0.5" max="50" step="0.5" value="${circleSearch?circleSearch.radius/1000:5}" ${circleSearch?'':'disabled'} aria-describedby="circleRadiusNote"><span id="circleRadiusNote" class="faint">円を描いたあと、0.5〜50kmで調整できます。</span></div><div id="circleSearchMap" class="circle-search-map" aria-label="公開エリアから活動を探す地図"></div><p id="circleMapNetwork" class="faint" role="status"></p><p class="faint" style="margin:12px 0">ピンは市町村の代表点を使ったサンプルです。円の検索結果もこの目安の位置で判定します。実際の活動場所や集合場所を示すものではありません。</p><div id="circleMapResults">${mapResultHTML()}</div></div>`;
}
function bindCircleMap(){
 const box=document.getElementById('circleSearchMap'),draw=document.getElementById('drawMapCircle'),clear=document.getElementById('clearMapCircle'),centerButton=document.getElementById('circleMapCenter'),radius=document.getElementById('circleRadius'),radiusLabel=document.getElementById('circleRadiusLabel'),hint=document.getElementById('circleMapHint');
 if(typeof L==='undefined'){box.innerHTML='<div class="empty-state"><p>地図の部品を読み込めませんでした。再読み込みするか、下の一覧から活動を探してください。</p></div>';[draw,centerButton,clear,radius].forEach(el=>el.disabled=true);return;}
 const map=L.map(box,{zoomControl:true,scrollWheelZoom:false,minZoom:7,maxZoom:17});activeCircleMap=map;
 const point=PUBLIC_MAP_POINTS[mapFilters.city]||[36.36,139.16];
 if(circleMapView&&circleMapView.city===mapFilters.city)map.setView(circleMapView.center,circleMapView.zoom);else map.setView(point,mapFilters.city==='all'?10:12);
 const tile=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors',referrerPolicy:'strict-origin-when-cross-origin'}).addTo(map);
 const network=document.getElementById('circleMapNetwork');tile.on('tileerror',()=>network.textContent='背景地図を読み込めない箇所があります。公開エリアのピンと円の検索は使えます。Googleマップでも地域を確認できます。');
 L.control.scale({imperial:false}).addTo(map);
 const markers=L.layerGroup().addTo(map);let circleLayer=null,drawing=false,pointer=null;
 const latArray=latlng=>[latlng.lat,latlng.lng];
 const renderCircle=()=>{if(circleLayer)map.removeLayer(circleLayer);circleLayer=circleSearch?L.circle(circleSearch.center,{radius:circleSearch.radius,color:'#075333',weight:3,fillColor:'#C7F238',fillOpacity:.22,interactive:false}).addTo(map):null;};
 const repaint=()=>{
 renderCircle();const list=activitiesInCircle(filteredActivities());markers.clearLayers();
 Object.entries(PUBLIC_MAP_POINTS).forEach(([city,coords])=>{const group=list.filter(a=>a.city===city);if(!group.length)return;const marker=L.circleMarker(coords,{radius:10,color:'#fff',weight:3,fillColor:'#075333',fillOpacity:1}).addTo(markers);const popup=document.createElement('div');const title=document.createElement('strong');title.textContent=city+'の活動 '+group.length+'件（目安の位置）';popup.append(title);group.forEach(a=>{const button=document.createElement('button');button.type='button';button.className='map-activity-link';button.textContent=a.title;button.onclick=()=>nav('detail',a.id);popup.append(button);});marker.bindPopup(popup);marker.bindTooltip(city+' '+group.length+'件',{direction:'top'});});
 const results=document.getElementById('circleMapResults');results.innerHTML=mapResultHTML();results.querySelectorAll('[data-open-detail]').forEach(b=>b.onclick=()=>nav('detail',b.dataset.openDetail));
 radius.disabled=!circleSearch;clear.disabled=!circleSearch;if(circleSearch)radius.value=circleSearch.radius/1000;radiusLabel.textContent=circleSearch?(circleSearch.radius/1000).toFixed(1)+'km':'未指定';
 };
 const setDraw=value=>{drawing=value;draw.setAttribute('aria-pressed',String(value));draw.textContent=value?'円を描くのをやめる':'円で囲んで探す';box.classList.toggle('circle-drawing',value);if(value){map.dragging.disable();map.touchZoom.disable();map.doubleClickZoom.disable();hint.textContent='地図を押したまま外側へ動かして円を描いてください。タップなら半径5kmです。';}else{map.dragging.enable();map.touchZoom.enable();map.doubleClickZoom.enable();hint.textContent=circleSearch?'円の範囲で絞り込みました。半径を調整したり、別の円を描き直せます。':'「円で囲んで探す」を押して、中心から外側へドラッグしてください。';}};
 const clampRadius=value=>Math.min(50000,Math.max(500,Math.round(value/500)*500));
 draw.onclick=()=>setDraw(!drawing);
 centerButton.onclick=()=>{circleSearch={center:latArray(map.getCenter()),radius:5000};setDraw(false);repaint();};
 clear.onclick=()=>{circleSearch=null;pointer=null;setDraw(false);repaint();};
 radius.oninput=()=>{if(circleSearch){circleSearch.radius=Number(radius.value)*1000;repaint();}};
 box.addEventListener('pointerdown',e=>{if(!drawing||e.button>0||e.target.closest('.leaflet-control'))return;e.preventDefault();e.stopPropagation();pointer={id:e.pointerId,x:e.clientX,y:e.clientY,center:latArray(map.mouseEventToLatLng(e)),previous:circleSearch};box.setPointerCapture(e.pointerId);circleSearch={center:pointer.center,radius:500};renderCircle();},true);
 box.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;e.preventDefault();circleSearch.radius=clampRadius(distanceInMeters(pointer.center,latArray(map.mouseEventToLatLng(e))));renderCircle();radiusLabel.textContent=(circleSearch.radius/1000).toFixed(1)+'km';},true);
 box.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;e.preventDefault();e.stopPropagation();if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)<8)circleSearch.radius=5000;pointer=null;if(box.hasPointerCapture(e.pointerId))box.releasePointerCapture(e.pointerId);setDraw(false);repaint();},true);
 box.addEventListener('pointercancel',()=>{if(pointer){circleSearch=pointer.previous;pointer=null;setDraw(false);repaint();}},true);
 box.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pointer){circleSearch=pointer.previous;pointer=null;repaint();}setDraw(false);draw.focus();}});
 map.on('moveend',()=>{circleMapView={center:latArray(map.getCenter()),zoom:map.getZoom(),city:mapFilters.city};});
 map.invalidateSize();repaint();
}

/* ================= View: LIST ================= */
function groupedActivitiesHTML(list){
  if(!list.length) return '<div class="empty-state"><p>条件に合う活動が見つかりませんでした。検索語や絞り込みを変更してください。</p></div>';
  return Object.entries(GENRES).map(([key,g])=>{
    const acts=list.filter(a=>a.genre===key);
    if(!acts.length) return '';
    return `<section class="activity-group" aria-labelledby="group-${key}"><h3 id="group-${key}" style="border-left:5px solid ${g.color};padding-left:12px;font-size:20px;margin:0 0 18px;">${g.label} <span class="badge badge-neutral">${acts.length}件</span></h3><div class="act-grid">${acts.map(actCardHTML).join('')}</div></section>`;
  }).join('');
}

const COMMUNITY_LINKS={website:'ホームページ',instagram:'Instagram',x:'X',youtube:'YouTube',other:'その他のSNS'};
function safeCommunityURL(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}}
function communityMediaFields(media={}){
 return `<div data-media-editor><h3>普段の活動写真・公式リンク</h3><p class="hint">写真は3枚まで。顔が写る人の掲載同意を確認し、住所などが写り込んでいないものを選んでください。</p><div class="field"><label>活動写真（JPEG・PNG・WebP、1枚5MBまで）<input type="file" data-media-files accept="image/jpeg,image/png,image/webp" multiple></label></div><div data-media-previews class="community-photos"></div><p data-media-message role="status" class="hint"></p>${Object.entries(COMMUNITY_LINKS).map(([key,label])=>`<div class="field"><label>${label}（任意）<input type="url" data-media-link="${key}" placeholder="https://…" value="${campusEscape(media.links?.[key]||'')}"></label></div>`).join('')}<p class="hint">写真・リンクは公開前に運営が確認します。この試作版では自分のアカウントのサンプル記録として保存されます。</p></div>`;
}
function communityMediaHTML(id){
 const m=DB.communityMedia?.[id]?.published;
 if(!m)return `<div class="detail-block"><h3>普段の活動の様子</h3><p class="faint">活動写真・公式リンクはまだ登録されていません。</p></div>`;
 return `<div class="detail-block"><h3>普段の活動の様子</h3><div class="community-photos">${(m.photos||[]).map((p,i)=>`<figure><img src="${p.src}" alt="${campusEscape(p.caption||'普段の活動写真 '+(i+1))}" loading="lazy"><figcaption>${campusEscape(p.caption||'')}</figcaption></figure>`).join('')}</div><div class="filter-row">${Object.entries(m.links||{}).filter(([,v])=>safeCommunityURL(v)).map(([k,v])=>`<a class="btn btn-secondary" href="${campusEscape(safeCommunityURL(v))}" target="_blank" rel="noopener noreferrer">${COMMUNITY_LINKS[k]||'公式リンク'} ↗</a>`).join('')}</div></div>`;
}
function bindCommunityMediaEditor(scope,initial={}){
 const box=scope.querySelector('[data-media-editor]');if(!box)return;
 let photos=(initial.photos||[]).map(p=>({...p})),busy=false;
 const note=box.querySelector('[data-media-message]');
 const draw=()=>{box.querySelector('[data-media-previews]').innerHTML=photos.map((p,i)=>`<div><img src="${p.src}" alt="登録予定の写真 ${i+1}"><label>写真の説明<input data-photo-caption="${i}" maxlength="100" value="${campusEscape(p.caption||'')}" placeholder="例：みんなでイベントの準備"></label><button type="button" class="btn btn-ghost btn-sm" data-photo-remove="${i}">削除</button></div>`).join('');box.querySelectorAll('[data-photo-remove]').forEach(b=>b.onclick=()=>{photos.splice(Number(b.dataset.photoRemove),1);draw();});box.querySelectorAll('[data-photo-caption]').forEach(el=>el.oninput=()=>photos[Number(el.dataset.photoCaption)].caption=el.value);};
 box.querySelector('[data-media-files]').onchange=async e=>{
 if(busy)return;busy=true;note.textContent='写真を読み込んでいます…';
 try{const files=[...e.target.files];if(photos.length+files.length>3)throw Error('写真は合計3枚までです。');
 const incoming=[];for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024)throw Error('JPEG・PNG・WebP形式で、5MB以下の写真を選んでください。');const url=URL.createObjectURL(f);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,900/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);incoming.push({src:canvas.toDataURL('image/jpeg',.78),caption:''});}finally{URL.revokeObjectURL(url);}}
 photos.push(...incoming);draw();note.textContent='写真を追加しました。保存または登録リクエストを送信してください。';
 }catch(err){note.textContent=err.message;}finally{busy=false;e.target.value='';}
 };
 draw();
 return ()=>{if(busy)throw Error('写真の読み込みが終わってから送信してください。');const links={};box.querySelectorAll('[data-media-link]').forEach(el=>{const value=el.value.trim();if(value&&!safeCommunityURL(value))throw Error('リンクは https:// または http:// から入力してください。');if(value)links[el.dataset.mediaLink]=safeCommunityURL(value);});return {photos:photos.map(p=>({...p})),links};};
}
function orgMediaHTML(){const entry=DB.communityMedia?.[CURRENT_ORG_ID];return `<form id="orgMediaForm" class="card" style="padding:20px">${communityMediaFields(entry?.pending||entry?.published)}${entry?.pending?'<p class="hint">写真・リンクの更新を審査中です。</p>':''}<button type="submit" class="btn btn-primary">写真・リンクを審査へ送る</button></form>`;}
function bindOrgMedia(){const form=document.getElementById('orgMediaForm');if(!form)return;const entry=DB.communityMedia?.[CURRENT_ORG_ID],read=bindCommunityMediaEditor(form,entry?.pending||entry?.published);form.onsubmit=e=>{e.preventDefault();try{const media=read();const previous=DB.communityMedia;DB.communityMedia={...previous,[CURRENT_ORG_ID]:{...entry,pending:media}};try{if(!save())throw Error('ログインが必要です。');}catch{DB.communityMedia=previous;throw Error('保存容量が足りません。写真を減らして再度お試しください。');}toast('写真・リンクを審査へ送りました（デモ）');render();}catch(err){toast(err.message);}};}
function adminMediaHTML(){return `<h3 style="margin:24px 0 12px">団体の活動写真・公式リンクの審査</h3>${Object.entries(DB.communityMedia||{}).filter(([,m])=>m.pending).map(([id,m])=>`<div class="card" style="padding:16px;margin-bottom:12px"><h4>${campusEscape(communityById(id)?.name||id)}</h4><div class="community-photos">${m.pending.photos.map(p=>`<figure><img src="${p.src}" alt="審査用写真"><figcaption>${campusEscape(p.caption)}</figcaption></figure>`).join('')}</div>${Object.entries(m.pending.links).map(([k,v])=>`<p>${COMMUNITY_LINKS[k]}：<a href="${campusEscape(safeCommunityURL(v))}" target="_blank" rel="noopener noreferrer">${campusEscape(v)}</a></p>`).join('')}<button class="btn btn-primary" data-media-approve="${id}">確認して公開</button><button class="btn btn-ghost" data-media-reject="${id}">差し戻す</button></div>`).join('')||'<p class="faint">確認待ちの更新はありません。</p>'}`;}

function viewRetiredSample(){return `<div class="container section"><div class="card account-card"><h1>このページは公開を終了しました</h1><p>以前の体験用サンプルのページです。申込み・通報・ブロックは団体に届かないため、現在は利用できません。</p><p>運営が確認した団体と、参加を受け付けている活動から探してください。</p><div class="live-navigation"><button class="btn btn-primary" data-nav="list">活動を探す</button><button class="btn btn-secondary" data-nav="regional">地域コミュニティを探す</button></div></div></div>`;}

 root.querySelector('[role=dialog]').setAttribute('aria-labelledby','avatarHeading');
 const update=()=>{
 root.querySelector('#avatarPreview').innerHTML=avatarSVG(draft);
 root.querySelector('#avatarName').textContent=draft.type+'の相棒';
 root.querySelectorAll('[data-part]').forEach(b=>b.setAttribute('aria-pressed',String(draft[b.dataset.part]===b.dataset.value)));
 root.querySelectorAll('[data-avatar-field]').forEach(f=>{const k=f.dataset.avatarField;f.hidden=legacyKeys.includes(k)?draft.type!=='ひと':(['body','accessory'].includes(k)?draft.type==='ひと':k==='mouth'&&draft.type==='とびら');});
 };
 root.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{draft[b.dataset.part]=b.dataset.value;update();});
 root.querySelector('#avatarRandom').onclick=()=>{Object.entries(AVATAR_OPTIONS).forEach(([k,o])=>draft[k]=o.values[Math.floor(Math.random()*o.values.length)]);update();};
 root.querySelector('#avatarForm').onsubmit=e=>{e.preventDefault();const previous=DB.profile.avatar;DB.profile.avatar=cleanAvatar(draft);if(!save()){DB.profile.avatar=previous;toast('保存できませんでした。ブラウザの保存容量をご確認ください。');return;}closeModal();document.querySelectorAll('[data-avatar-picture]').forEach(el=>el.innerHTML=avatarSVG(DB.profile.avatar));toast('新しい相棒を保存しました');};
 update();
 });
}

  }
  return '';

function openApplyModal(activityId, kind){
  if(!accountUser){nav('login');return;}
  const a = activityById(activityId);
  openModal(`
    <div class="modal-head">
      <div>
        <div class="faint">${kind}の申込み</div>
        <h3 style="font-size:18px;font-weight:900;">${a.title}</h3>
      </div>
      <button class="modal-close" data-modal-close>✕</button>
    </div>
    <form id="applyForm">
      <div class="field"><label>ニックネーム</label><input type="text" id="af_name" required placeholder="例：あかぎ太郎" value="${campusEscape(DB.profile.nickname||'')}"></div>
      <div class="field"><label>学校・学年（任意）</label><input type="text" id="af_school" placeholder="例：群馬大学2年" value="${campusEscape(DB.profile.school||'')}"></div>
      <div class="field"><label>参加希望日</label><input type="text" id="af_date" placeholder="${a.dateLabel}" value=""></div>
      <div class="field"><label>参加人数</label><input type="number" id="af_count" min="1" value="1"></div>
      <div class="checkline" style="margin-bottom:10px;"><input type="checkbox" id="af_minor"><label for="af_minor">参加者は18歳未満です</label></div>
      <div id="guardianBox" style="display:none;margin-bottom:16px;">
        <div class="info-box warn">${icon('warn')}<div><p style="font-size:13.5px;">保護者の同意が必要です。</p></div></div>
        <div class="checkline" style="margin-top:10px;"><input type="checkbox" id="af_guardian"><label for="af_guardian">保護者の同意を得ています（当日、同意書をお持ちください）</label></div>
      </div>
      <div class="field"><label>団体へのメッセージ（任意）</label><textarea id="af_msg" placeholder="意気込みや質問があればご記入ください"></textarea></div>
      <div class="info-box" style="margin-bottom:16px;">${icon('info')}<div><p style="font-size:13.5px;">申込み後の連絡はサービス内メッセージで行います。正確な集合場所は、団体が承認した後にお知らせします。</p></div></div>
      <button type="submit" class="btn btn-primary btn-block">申込みを送信する</button>
    </form>
  `, (root)=>{
    const minor = root.querySelector('#af_minor');
    const guardianBox = root.querySelector('#guardianBox');
    minor.addEventListener('change', ()=>{ guardianBox.style.display = minor.checked ? 'block' : 'none'; });
    root.querySelector('#applyForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      if(minor.checked && !root.querySelector('#af_guardian').checked){
        toast('保護者の同意についてご確認ください');
        return;
      }
      const name = root.querySelector('#af_name').value.trim() || 'ゲスト';
      DB.applications.unshift({
        id:'app'+Date.now(), activityId, kind, name,
        school: root.querySelector('#af_school').value.trim(),
        count: root.querySelector('#af_count').value,
        date: root.querySelector('#af_date').value.trim(),
        minor: minor.checked,
        message: root.querySelector('#af_msg').value.trim(),
        status:'pending', createdAt: new Date().toISOString().slice(0,10),
      });
      DB.profile.nickname = name;
      save();
      closeModal();
      nav('mypage');
      mypageTab='apps';
      render();
      awardPoints(10, '申込みを受け付けました');
      checkAchievements();
    });
  });
}

/* ================= Report modal ================= */
function openReportModal(targetType, targetId){
  if(ACCOUNT_SERVER){toast('これはサンプル活動です。実際の団体への相談は、登録団体の紹介ページから送信してください。');return;}
  const targetLabel = targetType==='activity' ? activityById(targetId).title : communityById(targetId).name;
  openModal(`
    <div class="modal-head">
      <div><div class="faint">匿名相談・通報</div><h3 style="font-size:18px;font-weight:900;">${targetLabel}</h3></div>
      <button class="modal-close" data-modal-close>✕</button>
    </div>
    <form id="reportForm">
      <div class="field"><label>種類</label>
        <select id="rp_type">
          <option value="consult">相談したい（不安・質問など）</option>
          <option value="report">通報したい（規約違反・不適切な内容など）</option>
        </select>
      </div>
      <div class="field"><label>内容（任意）</label><textarea id="rp_msg" placeholder="差し支えなければ詳しく教えてください"></textarea></div>
      <p class="faint" style="margin-bottom:14px;">${icon('shield')} 送信内容は匿名で運営者に届きます。緊急性が高いと判断した場合、対象の掲載を停止することがあります。</p>
      <button type="submit" class="btn btn-danger btn-block">${icon('flag')}送信する</button>
    </form>
  `, (root)=>{
    root.querySelector('#reportForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      DB.reports.unshift({
        id:'rep'+Date.now(), type: root.querySelector('#rp_type').value,
        targetType, targetId, targetLabel,
        message: root.querySelector('#rp_msg').value.trim(),
        createdAt: new Date().toISOString().slice(0,10), status:'open'
      });
      save();
      closeModal();
      toast('送信しました。運営者が内容を確認します。');
    });
  });
}
function blockCommunity(id){
  if(ACCOUNT_SERVER){toast('これはサンプル団体です。実際の団体のブロックは、登録団体の紹介ページから設定してください。');return;}
  if(!DB.blocked.includes(id)) DB.blocked.push(id);
  DB.reports.unshift({id:'rep'+Date.now(), type:'block', targetType:'community', targetId:id, targetLabel:communityById(id).name, message:'ブロック依頼', createdAt:new Date().toISOString().slice(0,10), status:'open'});
  save();
  toast('この団体をブロックしました。今後、表示や連絡が制限されます。');
}

function render(){
  if(routeToSurface())return;
  if(activeCircleMap){activeCircleMap.remove();activeCircleMap=null;}
  renderNav();
  const app = document.getElementById('app');
  const gated=accountGate();
  if(gated!==null){app.innerHTML=gated;bindAccountForm();bindGlobalActions(app);return;}
  const livePage=viewLivePage();
  if(livePage!==null){app.innerHTML=livePage;bindGlobalActions(app);bindLiveUI(app);return;}
  let html = '';
  switch(current.view){
    case 'login': html=viewAccount('login');break;
    case 'register': html=viewAccount('register');break;
    case 'home': html = viewHome(); break;
    case 'map': html = viewMap(); break;
    case 'list': html = viewList(); break;
    case 'campus': html = viewCampus(); break;
    // Sample listings are not sent to real organizers; with the account server only real listings are offered.
    case 'detail': html = ACCOUNT_SERVER?viewRetiredSample():viewDetail(current.param); break;
    case 'community': html = ACCOUNT_SERVER?viewRetiredSample():viewCommunity(current.param); break;
    case 'mypage': html = viewMypage(); break;
    case 'org': html = viewOrg(); break;
    case 'orgSignup': html = viewOrgSignup(); break;
    case 'admin': html = viewAdmin(); break;
    case 'safety': html = viewSafety(); break;
    case 'guide': html = viewGuide(); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
  bindAccountForm();

  if(current.view==='map'){bindFilterBar('m_',()=>render());bindCircleMap();}
  if(current.view==='list'){
    bindFilterBar('l_', render);
  }
  if(current.view==='mypage'){
    document.querySelectorAll('[data-mtab]').forEach(b=>b.addEventListener('click', ()=>{ mypageTab=b.dataset.mtab; render(); }));
    bindMypageForm();
  }
  if(current.view==='org'){
    document.querySelectorAll('[data-otab]').forEach(b=>b.addEventListener('click', ()=>{ orgTab=b.dataset.otab; render(); }));
    bindOrgActions();
  }
  if(current.view==='orgSignup'){
    bindOrgSignupActions();
  }
  if(current.view==='admin'){
    document.querySelectorAll('[data-atab]').forEach(b=>b.addEventListener('click', ()=>{ adminTab=b.dataset.atab; render(); }));
    bindAdminActions();
  }

  if(current.view==='campus') bindCampusSearch();
  bindGlobalActions(app);
  bindLiveUI(app);
}

function bindMypageForm(){
  const form = document.getElementById('profileForm');
  if(!form) return;
  document.getElementById('pf_year').value=DB.profile.year||'';
  bindSkillMatching();
  const schoolSelect=document.getElementById('pf_school');
  const schoolOther=document.getElementById('pf_schoolOther');
  const savedSchool=DB.profile.school||'';
  schoolSelect.value=GUNMA_UNIVERSITIES.includes(savedSchool)?savedSchool:(savedSchool?'__other':'');
  schoolOther.value=GUNMA_UNIVERSITIES.includes(savedSchool)?'':savedSchool;
  const syncSchool=()=>{
    const other=schoolSelect.value==='__other';
    document.getElementById('pf_schoolOtherWrap').hidden=!other;
    schoolOther.disabled=!other;
    schoolOther.required=other;
  };
  schoolSelect.addEventListener('change',()=>{syncSchool();if(schoolSelect.value==='__other')schoolOther.focus();});
  syncSchool();
  form.querySelectorAll('[data-chip]').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      e.preventDefault();
      const group = chip.dataset.chip, val = chip.dataset.val;
      if(group==='interests'&&val.startsWith('local_')){const selected=communityInterestSelected(DB.profile.interests,val);DB.profile.interests=DB.profile.interests.filter(id=>communityGenreKey(id)!==val);if(!selected)DB.profile.interests.push(val);chip.classList.toggle('on',!selected);return;}
      const arr = DB.profile[group];
      const i = arr.indexOf(val);
      if(i>-1) arr.splice(i,1); else arr.push(val);
      chip.classList.toggle('on');
    });
  });
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const participation=readConditionProfile();if(participation===false)return;
    DB.profile.participation=participation;
    DB.profile.nickname = document.getElementById('pf_nickname').value.trim();
    DB.profile.year = document.getElementById('pf_year').value;
    DB.profile.birthDate=document.getElementById('pf_birthDate').value;
    DB.profile.useSkillsMatching=document.getElementById('pf_useSkillsMatching').checked;
    DB.profile.excludedSkills=[...(document.getElementById('profileSkillPreview')._excluded||[])];
    DB.profile.receiveOffers=!!document.getElementById('pf_receiveOffers')?.checked;
    DB.profile.receiveCompanyOffers=!!document.getElementById('pf_receiveCompanyOffers')?.checked;DB.profile.receiveCareerOffers=!!document.getElementById('pf_receiveCareerOffers')?.checked;
    DB.profile.school = schoolSelect.value==='__other' ? schoolOther.value.trim() : schoolSelect.value;
    DB.profile.skills = document.getElementById('pf_skills').value.trim();
    save();
    try {await flushAccount();await refreshLive(false);toast('登録情報を保存しました');}catch(e){toast(e.message);}
    render();
  });
}
function bindOrgActions(){
  bindOrgMedia();
  const cf = document.getElementById('orgCreateForm');
  if(cf) cf.addEventListener('submit', (e)=>{
    e.preventDefault();
    DB.orgQueue.push({
      id:'p'+Date.now(), communityId:CURRENT_ORG_ID,
      title:document.getElementById('oc_title').value.trim(),
      genre:document.getElementById('oc_genre').value,
      targetYears:[...document.querySelectorAll('input[name=targetYear]:checked')].map(el=>el.value),
      city:communityById(CURRENT_ORG_ID).city,
      area:document.getElementById('oc_area').value.trim(),
      urgent:document.getElementById('oc_urgent').checked,
      status:'review', submittedAt:new Date().toISOString().slice(0,10)
    });
    save();
    toast('審査へ提出しました。運営者の確認をお待ちください。');
    render();
  });
  document.querySelectorAll('[data-org-approve]').forEach(b=>b.addEventListener('click', ()=>{
    const app = DB.applications.find(x=>x.id===b.dataset.orgApprove);
    if(app){ app.status='approved'; save(); render(); awardPoints(15, '参加が承認されました'); }
  }));
  document.querySelectorAll('[data-demo-approve]').forEach(b=>b.addEventListener('click', ()=>{
    toast('（デモ）承認しました。実際の応募が入るとここに反映されます。');
  }));
  document.querySelectorAll('[data-org-complete]').forEach(b=>b.addEventListener('click', ()=>{
    const apps = DB.applications.filter(a=>a.activityId===b.dataset.orgComplete && a.status==='approved');
    apps.forEach(a=>{ a.status='done'; });
    save();
    toast('完了報告を送信しました。参加者に活動証明が発行されます。');
    render();
    apps.forEach(a=>awardCompletionPoints(a));
  }));
  document.querySelectorAll('[data-trust-toggle]').forEach(cb=>cb.addEventListener('change', ()=>{
    toggleTrustCriterion(CURRENT_ORG_ID, cb.dataset.trustToggle);
  }));
  document.querySelectorAll('[data-trust-report]').forEach(b=>b.addEventListener('click', ()=>{
    const org = communityById(b.dataset.trustReport);
    const tier = trustTier(getTrustChecklist(org.id));
    openModal(`<div class="modal-head"><h3 style="font-size:17px;font-weight:900;">活動実績レポート（サンプル）</h3><button class="modal-close" data-modal-close>✕</button></div>
    <div class="card" style="padding:20px;border:2px solid var(--amber);">
      <p class="faint">${org.name}</p>
      <h3 style="margin:6px 0 12px;font-size:17px;">実施回数 ${org.pastCount}回／のべ参加人数 ${org.cumulativeParticipants||0}人／累計${org.cumulativeHours||0}時間</h3>
      <p class="muted" style="font-size:13.5px;">信頼ランク：${tier.label}（評価項目 ${tier.met}/${TRUST_CRITERIA.length}）</p>
    </div>
    <p class="faint" style="margin-top:12px;">実証版のため、実際のPDF出力・自治体への提出機能は今後実装予定です。</p>`);
  }));
}
function bindAdminActions(){
 document.querySelectorAll('[data-media-approve],[data-media-reject]').forEach(b=>b.onclick=()=>{const id=b.dataset.mediaApprove||b.dataset.mediaReject;const entry=DB.communityMedia[id];if(b.dataset.mediaApprove)entry.published=entry.pending;delete entry.pending;save();render();toast(b.dataset.mediaApprove?'写真・リンクを公開しました（デモ）':'写真・リンクを差し戻しました（デモ）');});
  document.querySelectorAll('[data-admin-org-approve]').forEach(b=>b.addEventListener('click', ()=>{
    const v = DB.orgPendingVerification.find(x=>x.id===b.dataset.adminOrgApprove); if(v){v.status='approved'; save(); toast('団体を承認しました'); render();}
  }));
  document.querySelectorAll('[data-admin-org-reject]').forEach(b=>b.addEventListener('click', ()=>{
    const v = DB.orgPendingVerification.find(x=>x.id===b.dataset.adminOrgReject); if(v){v.status='rejected'; save(); toast('団体の申請を却下しました'); render();}
  }));
  document.querySelectorAll('[data-admin-act-approve]').forEach(b=>b.addEventListener('click', ()=>{
    const q = DB.orgQueue.find(x=>x.id===b.dataset.adminActApprove); if(q){q.status='approved'; save(); toast('募集を承認し、公開しました'); render();}
  }));
  document.querySelectorAll('[data-admin-act-reject]').forEach(b=>b.addEventListener('click', ()=>{
    const q = DB.orgQueue.find(x=>x.id===b.dataset.adminActReject); if(q){q.status='rejected'; save(); toast('団体に差し戻しました'); render();}

    toast('この活動の掲載を緊急停止しました（デモ）');
  }));
  document.querySelectorAll('[data-admin-report-resolve]').forEach(b=>b.addEventListener('click', ()=>{
    const r = DB.reports.find(x=>x.id===b.dataset.adminReportResolve); if(r){r.status='resolved'; save(); toast('対応済みにしました'); render();}

}

parseHash();

startAccount();
